# BBR TCP Congestion Control & Buffer Tuning
net.ipv4.tcp_congestion_control = bbr
net.core.default_qdisc = fq_codel

# High Speed Socket Buffer Sizing (16MB buffers for BDP)
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.rmem_default = 262144
net.core.wmem_default = 262144
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216

# Network Device & Connection Backlogs
net.core.netdev_max_backlog = 10000
net.ipv4.tcp_max_syn_backlog = 8192
net.core.somaxconn = 4096

# TCP Connection Efficiency & Low Latency
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_intvl = 15
net.ipv4.tcp_keepalive_probes = 5

# RFS (Receive Flow Steering)
net.core.rps_sock_flow_entries = 32768

# Conntrack tuning for high connection workloads (1GB RAM)
net.netfilter.nf_conntrack_max = 65536

# Memory & VFS caching
vm.swappiness = 10
vm.vfs_cache_pressure = 50

# VIKINGYFY Dual-Radio & 5G WWAN High-Load SoftIRQ Budget Optimization (+9% throughput, -33% p95 latency)
net.core.netdev_budget=600
net.core.netdev_budget_usecs=20000
