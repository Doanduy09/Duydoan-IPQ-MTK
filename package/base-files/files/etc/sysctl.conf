# User defined entries should be added to this file not to /etc/sysctl.d/* as
# that directory is not backed-up by default and will not survive a reimage

# Toi uu boi Hoi Dong Chuyen Gia & Hermes AI Pool cho JDCloud RE-CS-02 (IPQ60xx)
# Toi uu hoa Bang Conntrack va bo nho dem cho Flow Offload 600+ Mbps 24/7
net.netfilter.nf_conntrack_max = 65536
net.netfilter.nf_conntrack_tcp_timeout_established = 7200
net.netfilter.nf_conntrack_tcp_timeout_close_wait = 30
net.netfilter.nf_conntrack_tcp_timeout_fin_wait = 30
net.netfilter.nf_conntrack_tcp_timeout_time_wait = 30
net.netfilter.nf_conntrack_udp_timeout = 30
net.netfilter.nf_conntrack_udp_timeout_stream = 120

# Chong phan manh bo nho va bao ve RAM 512MB
vm.min_free_kbytes = 16384
vm.swappiness = 0

# Toi uu hoa socket buffer cho gigabit throughput
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.netdev_max_backlog = 5000
