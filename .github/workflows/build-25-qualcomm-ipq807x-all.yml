name: Duydoan-25.12 Qualcomm IPQ807x All-Devices Multi-Target Build

on:
  schedule:
    - cron: '45 21 * * *'
  workflow_dispatch:
    inputs:
      release:
        description: 'Upload to GitHub Releases'
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build Qualcomm IPQ807x (19 Devices + NSS)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Initialize Build Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo docker system prune -af --volumes || true
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
            git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz \
            mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply \
            python3-docutils qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl \
            unzip vim wget xmlto xxd zlib1g-dev zstd
          sudo timedatectl set-timezone "Asia/Ho_Chi_Minh"

      - name: Update and Install Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          sed -i 's/int qma_setting_store/static int qma_setting_store/g' feeds/all/fibocom_QMI_WWAN/src/qmi_wwan_f.c 2>/dev/null || true
          sed -i 's/int qma_setting_store/static int qma_setting_store/g' feeds/qmodem/driver/fibocom_QMI_WWAN/src/qmi_wwan_f.c 2>/dev/null || true
          sed -i 's/struct sk_buff \*qmi_wwan_tx_fixup/static struct sk_buff \*qmi_wwan_tx_fixup/g' feeds/all/simcom_QMI_WWAN/src/qmi_wwan_s.c 2>/dev/null || true
          sed -i 's/struct sk_buff \*qmi_wwan_tx_fixup/static struct sk_buff \*qmi_wwan_tx_fixup/g' feeds/qmodem/driver/simcom_QMI_WWAN/src/qmi_wwan_s.c 2>/dev/null || true

      - name: Decrypt Secret Assets
        env:
          ALL_SECRET_KEY: ${{ secrets.ALL_SECRET_KEY }}
        run: |
          ENC_FILE="package/base-files/files/etc/init.d/all.enc"
          TARGET_FILE="package/base-files/files/etc/init.d/all"
          if [ -f "$ENC_FILE" ] && [ -n "$ALL_SECRET_KEY" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -pass pass:"$ALL_SECRET_KEY" -in "$ENC_FILE" | zcat > "$TARGET_FILE"
            chmod 755 "$TARGET_FILE"
          fi

      - name: Load Unified Multi-Device Seed Config
        run: |
          cp qualcomm_ipq807x_all.config .config
          make defconfig

      - name: Download Package Sources
        id: package
        run: |
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile Unified Firmware (Multi-Device)
        id: compile
        run: |
          echo -e "$(nproc) thread compile for Qualcomm IPQ807x Multi-Device"
          make -j$(nproc) || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Prepare Firmware Artifacts
        id: organize
        if: steps.compile.outputs.status == 'success'
        run: |
          cd bin/targets/qualcommax/ipq807x
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload Firmware to Actions Artifacts
        uses: actions/upload-artifact@v4
        if: steps.organize.outputs.status == 'success'
        with:
          name: Duydoan-25.12_Qualcomm_IPQ807x_All_${{ env.BUILD_DATE }}
          path: ${{ env.FIRMWARE }}/*

      - name: Generate Release Notes
        if: steps.organize.outputs.status == 'success' && (inputs.release != false)
        run: |
          cat << 'EOF' > release_notes.md
          ### 🚀 Duydoan-25.12 Qualcomm IPQ807x Unified Multi-Target Release (NSS 12.5)

          * **Base Version**: ImmortalWrt 25.12 (Bleeding Edge)
          * **Platform Target**: Qualcomm Atheros IPQ8071A / IPQ8072A / IPQ8074A (4x Cortex-A53 + NPU NSS 12.5)
          * **Compilation Mode**: Multi-Device Unified Build (19 Thiết Bị Biên Dịch Đồng Thời)

          #### 📱 Danh Sách Chi Tiết 19 Thiết Bị IPQ807x:
          1. **Swaiot S10-SKY (`swaiot_s10sky`)**: IPQ8071/8074, 1GB DDR4, 16MB NOR + 256MB NAND, 1x 2.5G + 2x 1G, M.2 PCIe 5G + 2x USB 3.0.
          2. **Xiaomi AIoT AX3600 (`xiaomi_ax3600` / `stock`)**: IPQ8071A, 512MB RAM, 256MB NAND, 4x 1G, Wi-Fi 6 AX3000.
          3. **Xiaomi AX9000 Gaming (`xiaomi_ax9000` / `stock`)**: IPQ8072A, 1GB RAM, 256MB NAND, 1x 2.5G + 4x 1G, Tri-Band AX9000, USB 3.0.
          4. **Redmi AX6 (`redmi_ax6` / `stock`)**: IPQ8071A, 512MB RAM, 128MB NAND, 4x 1G, Wi-Fi 6 AX3000.
          5. **Linksys Velop MX Series (`mx4200v1`, `mx4200v2`, `mx4300`, `mx5300`, `mx8500`)**: Tri-Band Mesh Wi-Fi 6, 512MB–1GB RAM, USB 3.0.
          6. **Dynalink DL-WRX36 (`dynalink_dl-wrx36`)**: IPQ8072A, 1GB RAM, 256MB NAND, 1x 2.5G + 4x 1G, AX3600, USB 3.0.
          7. **QNAP QHora-301W (`qnap_301w`)**: IPQ8072A, 1GB RAM, 4GB eMMC, **2x 10GbE + 4x 1GbE**, AX3600, 2x USB 3.2.
          8. **Arcadyan AW1000 (`arcadyan_aw1000`)**: 5G CPE chuyên dụng, 1GB RAM, 512MB NAND, 1x 2.5G + 4x 1G, M.2 5G + khe SIM.
          9. **TP-Link Deco X80-5G (`tplink_deco-x80-5g`)**: 5G CPE Mesh, 1GB RAM, 256MB NAND, 1x 2.5G + 1x 1G, khe SIM 5G.
          10. **ZTE MF269 (`zte_mf269` / `stock`)**: CPE 4G/5G, 512MB RAM, 256MB NAND.
          11. **Aliyun AP8220 (`aliyun_ap8220`)**: IPQ8072A, 1GB RAM, 128MB NAND, 2x 2.5G PoE, AX3600.

          #### ⚡ Đồng Nhất 100% Kernel Modules (kmod) & Quay Số 5G Thông Minh:
          * Trọn bộ driver USB/PCIe 4G/5G (`mtk_t7xx`, `mhi_pci`, `qmi_wwan`, `cdc_mbim`, `rndis`, `ncm`, `ipheeth`), `WWAN Smart Dialer` & `Bác Sĩ 5G Watchdog`.
          * Qualcomm NSS 12.5 Hardware Offloading + BBR + Cryptodev + TTL 65.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: steps.organize.outputs.status == 'success' && (inputs.release != false)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: Duydoan-25.12-Qualcomm-IPQ807x-All-${{ env.BUILD_DATE }}
          name: Duydoan-25.12 Qualcomm IPQ807x Unified All-Devices Release ${{ env.BUILD_DATE }}
          body_path: release_notes.md
          files: ${{ env.FIRMWARE }}/*
