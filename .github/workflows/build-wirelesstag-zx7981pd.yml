name: Build Duydoan-24.10 WirelessTag ZX7981PD (Bleeding Edge)

on:
    # 05:40 AM Asia/Ho_Chi_Minh daily (22:40 UTC)
  workflow_dispatch:
    inputs:
      release:
        description: 'Upload firmware to GitHub Release'
        required: false
        default: true
        type: boolean

permissions: write-all

jobs:
  build:
    name: Build WirelessTag ZX7981PD (24.10)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Initialize Build Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
            git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz \
            mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply \
            python3-docutils qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl \
            unzip vim wget xmlto xxd zlib1g-dev zstd
          sudo timedatectl set-timezone "Asia/Ho_Chi_Minh"

      - name: Update and Install Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Decrypt Secret Assets
        env:
          ALL_SECRET_KEY: ${{ secrets.ALL_SECRET_KEY }}
        run: |
          ENC_FILE="package/base-files/files/etc/init.d/all.enc"
          TARGET_FILE="package/base-files/files/etc/init.d/all"
          if [ -f "$ENC_FILE" ] && [ -n "$ALL_SECRET_KEY" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -pass pass:"$ALL_SECRET_KEY" -in "$ENC_FILE" | zcat > "$TARGET_FILE"
            chmod 755 "$TARGET_FILE"
          fi

      - name: Load Seed Config
        run: |
          cp wirelesstag_zx7981pd.config .config
          make defconfig

      - name: Download Package Sources
        run: |
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile Firmware
        id: compile
        run: |
          echo -e "$(nproc) thread compile for WirelessTag ZX7981PD (24.10)"
          make -j$(nproc) || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Prepare Firmware Artifacts
        id: organize
        if: steps.compile.outputs.status == 'success'
        run: |
          cd bin/targets/mediatek/filogic
          rm -rf packages
          for itb in *sysupgrade.itb; do
            [ -f "$itb" ] && cp -f "$itb" "${itb%.itb}.bin"
          done
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload Firmware to Actions Artifacts
        uses: actions/upload-artifact@v4
        if: steps.organize.outputs.status == 'success'
        with:
          name: Duydoan-24.10_WirelessTag_ZX7981PD_${{ env.BUILD_DATE }}
          path: ${{ env.FIRMWARE }}/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: steps.organize.outputs.status == 'success' && (inputs.release != false)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: Duydoan-24.10-WirelessTag-ZX7981PD-${{ env.BUILD_DATE }}
          name: Duydoan-24.10 Wireless-Tag ZX7981PD 5G CPE Release ${{ env.BUILD_DATE }}
          body: |
            ### 🚀 Duydoan-24.10 (Bleeding Edge) for Wireless-Tag ZX7981PD 5G CPE
            * **Base Version**: ImmortalWrt 24.10 (Bleeding Edge)
            * **Target Hardware**: Wireless-Tag ZX7981PD / SmartPanel 5G CPE
              - **SoC**: MediaTek MT7981B (Filogic 820, Dual-Core Cortex-A53 1.3GHz)
              - **RAM**: 1GB DDR4
              - **Flash**: 128MB SPI-NAND
              - **Wi-Fi**: Wi-Fi 6 AX3000 (MediaTek MT7915E, 2.4GHz + 5GHz HE160, eeprom factory offset 0x0)
              - **Ethernet**: 1x Gigabit WAN, 2x Gigabit LAN (MediaTek MT7531 DSA Switch)
              - **Cellular Expansion**: M.2 Key-B 5G slot (Fibocom FM350-GL, FM160, Quectel RM500Q/RM520N, Sierra EM919x, etc.)
              - **Dual SIM Switching**: Tự động chuyển đổi hoặc điều khiển qua GPIO 25
              - **Modem Power/Reset**: Điều khiển chân Reset/Power qua GPIO 2
            * **Firmware Images**:
              - `*wirelesstag_zx7981pd-squashfs-factory.bin`: Dành cho nạp lần đầu qua Web Failsafe / U-Boot recovery.
              - `*wirelesstag_zx7981pd-squashfs-sysupgrade.bin`: Nâng cấp trực tiếp qua Web LuCI (System -> Backup / Flash Firmware).
              - `*wirelesstag_zx7981pd-initramfs-kernel.bin`: Firmware chạy tạm qua RAM bằng TFTP / U-Boot.
            * **Tích Hợp Tiện Ích Modem 5G & Kernel Modules**:
              - Trình điều khiển đầy đủ: `atinout`, `modemmanager`, `luci-proto-modemmanager`, `modemband`, `modemdata`, `modeminfo`, `xmm-modem`, `kmod-usb-net-qmi-wwan-fibocom`.
              - Hỗ trợ đổi TTL 65 chống bóp băng thông hotspot tự động.
              - Tự động nhận diện và quay số modem 4G/5G khi khởi động.
              - Giao diện quản lý modem tiếng Việt tối ưu, không phình code (Karpathy Anti-Bloat).
          files: ${{ env.FIRMWARE }}/*
