# [VERIFIED-GOLDEN: workflow-qualcomm-nss-25.12-1to1 | 2026-11-26 | DO NOT MODIFY UNLESS TARGETED]
name: "[qualcomm-nss-25.12] Build Qualcomm IPQ60xx + IPQ807x (Kernel 6.12 | Full-NSS 12.5)"

run-name: "[qualcomm-nss-25.12] Build ${{ inputs.target || 'all (IPQ60xx + IPQ807x)' }} (Kernel 6.12 | Full-NSS 12.5 | PassWall=${{ inputs.passwall || 'auto' }})"

on:
  push:
    branches:
      - qualcomm-nss-25.12
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/Auto-Clean.yml'
      - '.github/workflows/sync-immortalwrt.yml'
      - '.github/workflows/build-*.yml'
      - '!.github/workflows/build-qualcomm-nss-25.12.yml'
  schedule:
    # 01:30 AM Thứ 4 (Không PassWall) & Chủ Nhật (Có PassWall) ICT — Qualcomm IPQ Kernel 6.12 Full-NSS
    - cron: '30 18 * * 3,0'
  workflow_dispatch:
    inputs:
      target:
        description: 'Chọn dòng chip Kernel 6.12 trên nhánh qualcomm-nss-25.12'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - qualcomm-ipq60xx
          - qualcomm-ipq807x
      passwall:
        description: 'Biến thể PassWall (false = Không PassWall, true = Có PassWall, both = Cả hai)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
          - 'both'
      release:
        description: 'Xuất bản lên GitHub Releases'
        required: false
        default: true
        type: boolean

concurrency:
  group: duydoan-wrt612-qualcomm-nss-25.12-${{ inputs.target || 'all' }}-${{ inputs.passwall || 'auto' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: write
  actions: write

jobs:
  plan:
    name: "Plan [qualcomm-nss-25.12] Kernel 6.12 Matrix"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Generate Kernel 6.12 Build Matrix for qualcomm-nss-25.12
        id: set-matrix
        env:
          PLAT: ${{ inputs.target || 'all' }}
          PW_OPT: ${{ inputs.passwall || 'false' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - << 'PYEOF' > matrix.json
          import json, os
          from datetime import datetime, timedelta, timezone

          plat = os.environ.get("PLAT", "all")
          pw_opt = os.environ.get("PW_OPT", "false")
          event_name = os.environ.get("EVENT_NAME", "")
          if event_name == "schedule":
              # Chủ Nhật (ICT) -> Có PassWall; Ngày thường -> Không PassWall
              is_sunday_vn = datetime.now(timezone(timedelta(hours=7))).weekday() == 6
              pw_modes = [True] if is_sunday_vn else [False]
          elif event_name == "push":
              pw_modes = [False]
          else:
              pw_modes = [False, True] if pw_opt == "both" else [pw_opt == "true"]

          defs = [
              {
                  "id": "qualcomm-ipq60xx",
                  "config": "qualcomm_ipq60xx_nss.config",
                  "target_dir": "bin/targets/qualcommax/ipq60xx",
                  "base_title": "Qualcomm IPQ60xx (Full-NSS 12.5 Kernel 6.12)",
                  "tag_base": "Duydoan-6.12-FullNSS-IPQ60xx",
                  "copy_itb_to_bin": False,
              },
              {
                  "id": "qualcomm-ipq807x",
                  "config": "qualcomm_ipq807x_nss.config",
                  "target_dir": "bin/targets/qualcommax/ipq807x",
                  "base_title": "Qualcomm IPQ807x (Full-NSS 12.5 Kernel 6.12)",
                  "tag_base": "Duydoan-6.12-FullNSS-IPQ807x",
                  "copy_itb_to_bin": False,
              },
          ]

          selected_defs = defs if plat == "all" else [d for d in defs if d["id"] == plat]
          include = []
          for d in selected_defs:
              for pw in pw_modes:
                  badge = "[Có PassWall]" if pw else "[Không PassWall]"
                  tag_prefix = f"{d['tag_base']}-Passwall" if pw else d["tag_base"]
                  include.append({
                      "id": d["id"],
                      "ref": "qualcomm-nss-25.12",
                      "config": d["config"],
                      "target_dir": d["target_dir"],
                      "passwall": pw,
                      "title": f"{d['base_title']} {badge}",
                      "job_title": f"[qualcomm-nss-25.12] {d['base_title']} {badge}",
                      "tag_prefix": tag_prefix,
                      "release_title": f"{d['base_title']} {badge} All-Devices Release",
                      "copy_itb_to_bin": d["copy_itb_to_bin"],
                  })
          print(json.dumps({"include": include}))
          PYEOF
          MATRIX=$(cat matrix.json)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Matrix (qualcomm-nss-25.12): $MATRIX"

  build:
    name: "Build ${{ matrix.job_title }}"
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout Branch (qualcomm-nss-25.12)
        uses: actions/checkout@v5
        with:
          ref: qualcomm-nss-25.12

      - name: Free Disk, Mount /mnt SSD & Install Build Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          sudo docker system prune -af --volumes || true
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y --no-install-recommends \
            autoconf automake autopoint bc binutils bison build-essential bzip2 ca-certificates \
            ccache clang cmake cpio curl device-tree-compiler dos2unix file flex gawk gettext \
            gcc-multilib g++-multilib genisoimage git gperf help2man intltool jq \
            libbpf-dev libc6-dev-i386 libclang-dev libdw-dev libelf-dev libglib2.0-dev \
            libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libreadline-dev \
            libssl-dev libtool lld llvm ninja-build p7zip p7zip-full patch perl pkgconf \
            python3 python3-cryptography python3-dev python3-docutils python3-packaging \
            python3-pip python3-ply python3-pyelftools python3-setuptools qemu-utils re2c \
            rsync squashfs-tools subversion swig texinfo unzip wget xmlto xxd xz-utils \
            zlib1g-dev zstd
          sudo timedatectl set-timezone "Asia/Ho_Chi_Minh"

          sudo mkdir -p /mnt/build_wrt/.ccache /mnt/build_wrt/build_dir /mnt/build_wrt/staging_dir /mnt/build_wrt/dl
          sudo chown -R "$USER:$USER" /mnt/build_wrt
          for d in .ccache build_dir staging_dir dl; do
            rm -rf "$GITHUB_WORKSPACE/$d"
            ln -sfn "/mnt/build_wrt/$d" "$GITHUB_WORKSPACE/$d"
          done
          df -h / /mnt/build_wrt && free -h
          AVAIL_GB=$(df -BG --output=avail /mnt/build_wrt | tail -n1 | tr -dc '0-9')
          if [ "${AVAIL_GB:-0}" -lt 15 ]; then
            echo "::error::Insufficient disk space on /mnt/build_wrt (${AVAIL_GB}GB < 15GB)"
            exit 1
          fi

          python3 - << 'PYEOF'
          import json, os, re
          mf = "scripts/projectsmirrors.json"
          if os.path.isfile(mf):
              with open(mf, "r", encoding="utf-8") as f:
                  data = json.load(f)
              bad = re.compile(r"(\.cn/|tencent|aliyun)", re.I)
              for k, v in list(data.items()):
                  if isinstance(v, list):
                      filtered = [u for u in v if not bad.search(str(u))]
                      if filtered:
                          data[k] = filtered
              with open(mf, "w", encoding="utf-8") as f:
                  json.dump(data, f, indent="\t")
                  f.write("\n")
          PYEOF
          df -h

      - name: Restore Kernel 6.12 Build Cache (qualcomm-nss-25.12 / ${{ matrix.id }})
        id: cache-restore
        uses: actions/cache/restore@v5
        with:
          path: |
            /mnt/build_wrt/.ccache
            /mnt/build_wrt/staging_dir/host*
            /mnt/build_wrt/staging_dir/tool*
          key: wrt612-qualcomm-nss-25.12-${{ matrix.id }}-${{ hashFiles('tools/**', 'toolchain/**', 'feeds.conf.default', matrix.config) }}
          restore-keys: |
            wrt612-qualcomm-nss-25.12-${{ matrix.id }}-

      - name: Prepare Restored Build Cache
        if: steps.cache-restore.outputs.cache-matched-key != ''
        run: |
          find /mnt/build_wrt/staging_dir -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
            find "$DIR" -type f -exec touch {} +
          done
          mkdir -p tmp
          echo "1" > tmp/.build

      - name: Prepare Feeds, Kernel 6.12 Patches & Decrypt Assets
        run: |
          chmod +x scripts/ci-prepare.sh .github/scripts/*.sh
          ./scripts/ci-prepare.sh

      - name: Configure Seed & PassWall Toggle (qualcomm-nss-25.12 / ${{ matrix.id }})
        run: |
          cp "${{ matrix.config }}" .config
          if [ "${{ matrix.passwall }}" = "true" ]; then
            echo ">> [PASSWALL] Bật PassWall + Xray + Sing-Box + ChinaDNS-NG + Haproxy trên qualcomm-nss-25.12"
            cat << 'EOF' >> .config
          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_ChinaDNS_NG=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Haproxy=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Geosite=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Geoip=y
          CONFIG_PACKAGE_xray-core=y
          CONFIG_PACKAGE_sing-box=y
          CONFIG_PACKAGE_chinadns-ng=y
          CONFIG_PACKAGE_haproxy=y
          EOF
          else
            sed -i '/luci-app-passwall/d' .config
            echo "# CONFIG_PACKAGE_luci-app-passwall is not set" >> .config
          fi

          echo "CONFIG_PACKAGE_luci-app-doanduy-modem=y" >> .config
          echo "CONFIG_PACKAGE_umbim=y" >> .config
          echo "CONFIG_PACKAGE_uqmi=y" >> .config
          echo "CONFIG_PACKAGE_sms-tool=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-base-vi=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-firewall-vi=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-package-manager-vi=y" >> .config
          if [ "${{ matrix.id }}" = "qualcomm-ipq60xx" ]; then
            echo "CONFIG_PACKAGE_luci-app-athena-led=y" >> .config
          fi
          echo "CONFIG_PACKAGE_curl=y" >> .config
          echo "CONFIG_PACKAGE_wget-ssl=y" >> .config

          bash .github/scripts/prepare-build-host.sh
          bash .github/scripts/inject-common-kmods.sh
          make defconfig
          if grep -q '^CONFIG_USE_LLVM_BUILD=y$' .config; then
            echo "ERROR: CONFIG_USE_LLVM_BUILD=y still active!" >&2
            exit 1
          fi
          if ! grep -q '^CONFIG_PACKAGE_luci-app-doanduy-modem=y$' .config; then
            echo "::error::CRITICAL — luci-app-doanduy-modem=y dropped by make defconfig!" >&2
            exit 1
          fi
          bash .github/scripts/prepare-rust.sh
          echo ">> [qualcomm-nss-25.12] Active target devices count: $(grep -c '^CONFIG_TARGET_DEVICE_.*=y$' .config || echo 0)"

      - name: Download Package Sources
        run: |
          make download -j$(nproc)
          find dl/ -size -1024c -exec ls -l {} \;
          find dl/ -size -1024c -exec rm -f {} \;

      - name: Compile Kernel 6.12 Firmware (qualcomm-nss-25.12 / ${{ matrix.id }})
        id: compile
        env:
          CCACHE_DIR: /mnt/build_wrt/.ccache
          CCACHE_MAXSIZE: 1.5G
          CCACHE_COMPRESS: 1
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          echo "Compiling [qualcomm-nss-25.12] ${{ matrix.title }} with $(nproc) threads..."
          make -j$(nproc) || make -j1 V=s
          ccache -s || true
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Save Kernel 6.12 Build Cache (qualcomm-nss-25.12 / ${{ matrix.id }})
        if: success() && steps.cache-restore.outputs.cache-hit != 'true' && !(inputs.passwall == 'both' && matrix.passwall == true)
        uses: actions/cache/save@v5
        with:
          key: wrt612-qualcomm-nss-25.12-${{ matrix.id }}-${{ hashFiles('tools/**', 'toolchain/**', 'feeds.conf.default', matrix.config) }}
          path: |
            /mnt/build_wrt/.ccache
            /mnt/build_wrt/staging_dir/host*
            /mnt/build_wrt/staging_dir/tool*

      - name: Prepare Firmware Artifacts
        id: organize
        if: steps.compile.outputs.status == 'success'
        run: |
          cd "${{ matrix.target_dir }}"
          rm -rf packages kernel-debug.tar.zst
          if [ "${{ matrix.copy_itb_to_bin }}" = "true" ]; then
            for itb in *sysupgrade.itb; do
              [ -f "$itb" ] && [ ! -f "${itb%.itb}.bin" ] && cp -f "$itb" "${itb%.itb}.bin"
            done
          fi
          echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date +'%Y.%m.%d-%H%M')" >> "$GITHUB_ENV"
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Generate Dynamic Release Notes (Verified from profiles.json & manifest)
        if: steps.organize.outputs.status == 'success' && (github.event_name != 'workflow_dispatch' || inputs.release != false)
        env:
          MATRIX_RELEASE_TITLE: ${{ matrix.release_title }}
        run: |
          python3 - << 'PYEOF'
          import glob, json, os, re

          fw_dir = os.environ["FIRMWARE"]
          rel_title = os.environ["MATRIX_RELEASE_TITLE"]
          build_date = os.environ["BUILD_DATE"]
          profiles = []
          pp = os.path.join(fw_dir, "profiles.json")
          if os.path.isfile(pp):
              with open(pp, "r", encoding="utf-8") as f:
                  profiles = sorted(json.load(f).get("profiles", {}).keys())

          mf_pkgs = set()
          kernel_ver = "6.12"
          for mf in glob.glob(os.path.join(fw_dir, "*.manifest")):
              with open(mf, "r", encoding="utf-8", errors="replace") as f:
                  for ln in f:
                      pkg, _, ver = ln.partition(" - ")
                      pkg = pkg.strip()
                      if pkg:
                          mf_pkgs.add(pkg)
                          if pkg == "kernel":
                              mk = re.match(r"(\d+\.\d+\.\d+)", ver.strip())
                              if mk:
                                  kernel_ver = mk.group(1)

          core_pkgs = ("luci-app-passwall", "luci-app-passwall2", "xray-core", "xray-plugin", "sing-box", "chinadns-ng", "haproxy")
          has_pw = ("luci-app-passwall" in mf_pkgs) or ("luci-app-passwall2" in mf_pkgs)
          has_modem = "luci-app-doanduy-modem" in mf_pkgs
          found_cores = [p for p in core_pkgs if p in mf_pkgs]
          pw_line = f"✅ **CÓ tích hợp PassWall** (`{', '.join(found_cores)}`)" if has_pw else "❌ **KHÔNG tích hợp PassWall** (Bản Thuần / No-PassWall)"

          accel_parts = []
          if "qca-nss-ecm" in mf_pkgs or "kmod-qca-nss-ecm" in mf_pkgs:
              nss_mods = [m.replace("kmod-qca-nss-drv-", "") for m in ("kmod-qca-nss-drv-pppoe", "kmod-qca-nss-drv-bridge-mgr", "kmod-qca-nss-drv-vlan-mgr", "kmod-qca-nss-drv-qdisc") if m in mf_pkgs]
              accel_parts.append(f"Qualcomm Full-NSS 12.5 (`{', '.join(nss_mods) if nss_mods else 'ECM'}`)")
          if "kmod-mt_wifi" in mf_pkgs or "kmod-mediatek_hnat" in mf_pkgs or "kmod-warp" in mf_pkgs:
              mtk_mods = [m for m in ("kmod-mt_wifi", "kmod-warp", "kmod-mediatek_hnat") if m in mf_pkgs]
              accel_parts.append(f"MediaTek Native Wi-Fi + HNAT/WARP (`{', '.join(mtk_mods)}`)")
          elif "bridger" in mf_pkgs:
              accel_parts.append("MediaTek PPE + WED + `bridger`")
          accel_line = " + ".join(accel_parts) if accel_parts else "Hardware Offload"

          lines = [
              f"### 🚀 [qualcomm-nss-25.12] {rel_title} ({build_date})",
              "",
              f"* **Source Branch**: `qualcomm-nss-25.12`",
              f"* **Base Version**: ImmortalWrt 25.12 Next-Gen (Kernel {kernel_ver})",
              f"* **PassWall**: {pw_line}",
              f"* **Modem 5G & SmartHome Suite**: {'✅ `luci-app-doanduy-modem` v2.6.4+ & `quectel-cm` + `atinout` + Auto-Mesh Đa Chip (tích hợp sẵn)' if has_modem else '⚠️ Không thấy trong manifest'}",
              f"* **Hardware Acceleration**: {accel_line}",
              f"* **Compilation Mode**: Unified Multi-Device Build (**{len(profiles)} thiết bị**)",
              "",
              f"#### 📱 Danh Sách {len(profiles)} Thiết Bị:",
          ]
          for p in profiles:
              lines.append(f"- `{p}`")
          lines.extend([
              "",
              "#### ⚠️ Lưu Ý Flash An Toàn:",
              "- **Không giữ cấu hình cũ (`Keep settings`)** khi chuyển từ bản **Không NSS** sang **Full-NSS 12.5** hoặc đổi giữa các nhánh Kernel khác nhau.",
              "- Đối chiếu mã kiểm tra trong tệp `sha256sums` đi kèm trước khi nạp firmware.",
          ])

          with open("release_notes.md", "w", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")
          PYEOF

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v6
        if: steps.organize.outputs.status == 'success' && github.event_name == 'workflow_dispatch' && inputs.release == false
        with:
          name: ${{ matrix.tag_prefix }}_${{ env.BUILD_DATE }}
          path: ${{ env.FIRMWARE }}/*
          retention-days: 3

      - name: Create GitHub Release (Batched & Rate-Limit Resilient)
        if: steps.organize.outputs.status == 'success' && (github.event_name != 'workflow_dispatch' || inputs.release != false)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ matrix.tag_prefix }}-${{ env.BUILD_DATE }}
          RELEASE_TITLE: "[qualcomm-nss-25.12] ${{ matrix.release_title }} (${{ env.BUILD_DATE }})"
          RELEASE_NOTES_FILE: release_notes.md
          FIRMWARE_DIR: ${{ env.FIRMWARE }}
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/publish-release.py"

  cache-rollover:
    name: "Roll Old [qualcomm-nss-25.12] Caches"
    needs: [build]
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Prune Superseded Caches for qualcomm-nss-25.12
        run: |
          set -euo pipefail
          for prefix in wrt612-qualcomm-nss-25.12-qualcomm-ipq60xx- wrt612-qualcomm-nss-25.12-qualcomm-ipq807x-; do
            kept=0
            while IFS=$'\t' read -r cid ckey; do
              [ -n "$cid" ] || continue
              if [ "$kept" -eq 0 ]; then
                echo "Keep latest cache: $ckey (id=$cid)"
                kept=1
                continue
              fi
              echo "Delete superseded cache: $ckey (id=$cid)"
              gh cache delete "$cid" --repo "$GH_REPO" || echo "warn: delete failed for $cid"
            done < <(gh cache list --repo "$GH_REPO" --key "$prefix" --sort created_at --order desc --limit 50 --json id,key --jq '.[] | [.id, .key] | @tsv')
          done

  hermes_audit:
    name: "Hermes Sentinel Report [qualcomm-nss-25.12] (Kernel 6.12)"
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Signal Debian VM Hermes Sentinel (Build Completed)
        id: vm_signal
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          BRANCH: "qualcomm-nss-25.12"
          WORKFLOW_NAME: ${{ github.workflow }}
          VM_WEBHOOK_URL: ${{ secrets.VM_WEBHOOK_URL }}
          VM_WEBHOOK_SECRET: ${{ secrets.VM_WEBHOOK_SECRET }}
        run: |
          python3 - << 'PYEOF'
          import hashlib, hmac, json, os, time, urllib.request

          out_path = os.environ.get("GITHUB_OUTPUT", "")
          def set_out(k, v):
              if out_path:
                  with open(out_path, "a", encoding="utf-8") as f:
                      f.write(f"{k}={v}\n")

          url = os.environ.get("VM_WEBHOOK_URL", "").strip()
          if not url:
              set_out("delivered", "false")
              raise SystemExit(0)

          secret = os.environ.get("VM_WEBHOOK_SECRET", "").strip().encode("utf-8")
          repo = os.environ.get("REPO", "")
          run_id = os.environ.get("RUN_ID", "")
          delivered = False
          for attempt in range(1, 4):
              payload = {
                  "event": "build_completed",
                  "repo": repo,
                  "run_id": run_id,
                  "branch": "qualcomm-nss-25.12",
                  "workflow": os.environ.get("WORKFLOW_NAME", ""),
                  "result": os.environ.get("BUILD_RESULT", "unknown"),
                  "run_url": f"https://github.com/{repo}/actions/runs/{run_id}",
                  "ts": int(time.time()),
              }
              body = json.dumps(payload, separators=(",", ":")).encode("utf-8")
              headers = {"Content-Type": "application/json"}
              if secret:
                  sig = hmac.new(secret, body, hashlib.sha256).hexdigest()
                  headers["X-Sentinel-Signature"] = f"sha256={sig}"
              try:
                  req = urllib.request.Request(url, data=body, headers=headers, method="POST")
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      if 200 <= resp.status < 300:
                          delivered = True
                          break
              except Exception:
                  if attempt < 3:
                      time.sleep(5)
          set_out("delivered", "true" if delivered else "false")
          PYEOF

      - name: Fallback Direct Telegram (Only if VM Webhook Unreachable)
        if: steps.vm_signal.outputs.delivered != 'true'
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python3 - << 'PYEOF'
          import os, json, urllib.request
          tg_token = os.environ.get("TG_BOT_TOKEN", "").strip()
          tg_chat_id = os.environ.get("TG_CHAT_ID", "").strip()
          if not tg_token or not tg_chat_id:
              raise SystemExit(0)
          res = os.environ.get("BUILD_RESULT", "unknown")
          rid = os.environ.get("RUN_ID", "")
          repo = os.environ.get("REPO", "")
          emoji = "✅" if res == "success" else "⚠️"
