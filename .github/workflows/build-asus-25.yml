name: Build Duydoan-25.12 ASUS TUF-AX6000 (Bleeding Edge)

on:
  schedule:
    - cron: '25 23 * * *'  # 06:25 AM Asia/Ho_Chi_Minh daily (23:25 UTC)
  workflow_dispatch:
    inputs:
      release:
        description: 'Upload firmware to GitHub Release'
        required: false
        default: true
        type: boolean

permissions: write-all

env:
  REPO_URL: https://github.com/Doanduy09/JDCloud-RE-CS-02
  REPO_BRANCH: openwrt-25
  DEVICE_TARGET: mediatek
  DEVICE_SUBTARGET: filogic
  DEVICE_PROFILE: DEVICE_asus_tuf-ax6000
  CONFIG_FILE: asus_tuf-ax6000.config
  TZ: Asia/Ho_Chi_Minh

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: openwrt-25
          fetch-depth: 0

      - name: Auto-Sync Upstream ImmortalWrt 25.12
        run: |
          git config user.name "Doanduy09-Bot"
          git config user.email "doanduy09@gmail.com"
          git remote add upstream https://github.com/immortalwrt/immortalwrt.git || true
          git fetch upstream openwrt-25.12 --depth=50
          echo ">> Dang kiem tra va tu dong keo cap nhat moi nhat tu upstream immortalwrt:openwrt-25.12..."
          if git merge upstream/openwrt-25.12 -m "sync: auto-merge upstream immortalwrt:openwrt-25.12 daily updates"; then
            echo ">> Hop nhat commit moi thanh cong!"
            git push origin openwrt-25 || true
          else
            echo ">> Phat hien xung dot, tu dong bao luu cau hinh router..."
            git checkout --ours asus_tuf-ax6000.config jdcloud_re-cs-02-nss.config target/linux/qualcommax/image/ipq60xx.mk package/firmware/ipq-wifi/Makefile feeds.conf.default
            git add -A
            git commit -m "sync: resolve merge conflicts preserving device configs" || true
            git push origin openwrt-25 || true
          fi

      - name: Initialize Build Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
            git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz \
            mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply \
            python3-docutils qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl \
            unzip vim wget xmlto xxd zlib1g-dev zstd
          sudo timedatectl set-timezone "$TZ"

      - name: Update and Install Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load Seed Config
        run: |
          [ -e $CONFIG_FILE ] && cp $CONFIG_FILE .config
          make defconfig

      - name: Download Package Sources
        run: |
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile Firmware
        id: compile
        run: |
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Prepare Firmware Artifacts
        id: organize
        if: steps.compile.outputs.status == 'success'
        run: |
          cd bin/targets/$DEVICE_TARGET/$DEVICE_SUBTARGET
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload Firmware to Actions Artifacts
        uses: actions/upload-artifact@v4
        if: steps.organize.outputs.status == 'success'
        with:
          name: Duydoan-25.12_ASUS_TUF-AX6000_${{ env.BUILD_DATE }}
          path: ${{ env.FIRMWARE }}/*

      - name: Delete Old ASUS 25.12 Releases Before Publishing
        uses: ophub/delete-releases-workflows@main
        if: steps.organize.outputs.status == 'success' && (inputs.release == true || github.event_name == 'schedule')
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          delete_releases: true
          delete_tag_pattern: '^Duydoan-25\\.12-ASUS-AX6000-'
          releases_keep_latest: 0
          delete_tags: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: steps.organize.outputs.status == 'success' && (inputs.release == true || github.event_name == 'schedule')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: Duydoan-25.12-ASUS-AX6000-${{ env.BUILD_DATE }}
          name: Duydoan-25.12 ASUS TUF-AX6000 Release ${{ env.BUILD_DATE }}
          body: |
            ### Duydoan-25.12 for ASUS TUF Gaming AX6000 (Bleeding Edge)
            * **Base Version**: Duydoan-25.12 (Kernel 6.12 Bleeding Edge)
            * **Upstream Synchronization**: Auto-synchronized daily with official ImmortalWrt 25.12 repository.
            * **Target Hardware**: ASUS TUF Gaming AX6000 (MediaTek MT7986A Filogic 830, 4x Cortex-A53 @ 2.0 GHz)
            * **MediaTek HNAT (PPE + WED)**: Native Mainline Kernel 6.12 Hardware Flow Offloading for dual 2.5Gbps / 1Gbps ports and 4x4 Wi-Fi 6 with near-zero CPU usage.
            * **SafeXcel Crypto Engine**: Hardware-accelerated cryptographic processing for WireGuard, IPsec, and TLS.
            * **Wi-Fi 6 AX6000**: MT7976GN (2.4GHz 1148Mbps) + MT7976AN (5GHz 4804Mbps).
            * **Full Application Suite**: Integrated PassWall, SSR-Plus, Bypass, dae, TurboACC, TTYD, and BBR congestion control.
          files: ${{ env.FIRMWARE }}/*
