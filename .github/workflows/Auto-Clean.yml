# SPDX-License-Identifier: MIT
# Smart Maintenance Workflow: Keeps the latest release per platform, purges older releases & stale runs safely

name: Auto-Clean

on:
  schedule:
    # 12:00 PM Asia/Ho_Chi_Minh daily (05:00 UTC) - Runs AFTER morning builds finish
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      keep_per_platform:
        description: 'Số bản Release mới nhất giữ lại cho mỗi nền tảng (Filogic / IPQ60xx / IPQ807x)'
        required: false
        default: '1'
        type: string

permissions:
  contents: write
  actions: write

jobs:
  smart_clean:
    name: Smart Release & Workflow Run Cleanup
    runs-on: ubuntu-latest
    steps:
      - name: Safe Purge Old Releases (Always Keep Latest Per Platform)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: ${{ inputs.keep_per_platform || '1' }}
          REPO: ${{ github.repository }}
        run: |
          python3 - << 'PYEOF'
          import json, os, subprocess

          repo = os.environ["REPO"]
          keep = max(1, int(os.environ.get("KEEP", "1")))
          prefixes = [
              "Duydoan-25.12-MediaTek-Filogic-All-",
              "Duydoan-25.12-Qualcomm-IPQ60xx-All-",
              "Duydoan-25.12-Qualcomm-IPQ807x-All-",
          ]

          out = subprocess.check_output(
              ["gh", "release", "list", "--repo", repo, "--limit", "100", "--json", "tagName,createdAt"],
              text=True,
          )
          releases = json.loads(out)
          releases.sort(key=lambda r: r.get("createdAt", ""), reverse=True)

          kept_counts = {p: 0 for p in prefixes}
          to_delete = []

          for r in releases:
              tag = r["tagName"]
              matched = next((p for p in prefixes if tag.startswith(p)), None)
              if matched:
                  if kept_counts[matched] < keep:
                      kept_counts[matched] += 1
                      print(f"[KEEP] {tag}")
                  else:
                      to_delete.append(tag)
              else:
                  # Legacy single-device releases can be safely pruned once unified releases exist
                  if all(c >= 1 for c in kept_counts.values()):
                      to_delete.append(tag)
                  else:
                      print(f"[SAFE-KEEP-LEGACY] {tag}")

          for tag in to_delete:
              print(f"[DELETE] {tag}")
              subprocess.run(
                  ["gh", "release", "delete", tag, "--repo", repo, "-y", "--cleanup-tag"],
                  check=False,
              )
          PYEOF

      - name: Purge Old Completed Workflow Runs (Keep Latest 15)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          RUN_IDS=$(gh run list --repo "$REPO" --status completed --limit 150 --json databaseId -q '.[15:][].databaseId' || true)
          for rid in $RUN_IDS; do
            if [ -n "$rid" ]; then
              echo ">> Deleting old run: $rid"
              gh run delete "$rid" --repo "$REPO" || true
            fi
          done
