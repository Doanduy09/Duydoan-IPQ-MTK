# SPDX-License-Identifier: MIT
# Automated maintenance workflow: Cleans old workflow runs and artifacts daily

name: Auto-Clean

on:
  schedule:
    - cron: '30 23 * * *'  # 06:30 AM Asia/Ho_Chi_Minh (23:30 UTC), 30 mins before 07:00 daily build
  workflow_dispatch:

permissions: write-all

jobs:
  auto_clean:
    runs-on: ubuntu-latest
    steps:
      - name: Delete Old Workflows and Artifacts
        uses: ophub/delete-releases-workflows@main
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          delete_releases: false
          delete_tags: false
          delete_workflows: true
          workflows_keep_day: 1
          delete_artifacts: true
          artifacts_keep_day: 1
