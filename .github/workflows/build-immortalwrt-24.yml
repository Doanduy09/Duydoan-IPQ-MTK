# [VERIFIED-GOLDEN: workflow-immortalwrt-24-v2 | 2026-11-26 | DO NOT MODIFY UNLESS TARGETED]
name: "[immortalwrt-24] Build IPQ60xx + IPQ807x + Filogic (24.10 Kernel 6.6) [Không PassWall]"

run-name: "[immortalwrt-24] Build ${{ inputs.target || 'all (IPQ60xx + IPQ807x + Filogic)' }} (24.10 Kernel 6.6) [Không PassWall]"

on:
  push:
    branches:
      - immortalwrt-24
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/Auto-Clean.yml'
      - '.github/workflows/sync-immortalwrt.yml'
      - '.github/workflows/build-*.yml'
      - '!.github/workflows/build-immortalwrt-24.yml'
  schedule:
    # 01:30 AM Thứ 3 & Thứ 6 ICT — ImmortalWrt 24.10 Stable (Kernel 6.6) Không PassWall
    - cron: '30 18 * * 2,5'
  workflow_dispatch:
    inputs:
      target:
        description: 'Chọn dòng chip cần build trên nhánh immortalwrt-24 (24.10 Kernel 6.6)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - qualcomm-ipq
          - qualcomm-ipq60xx
          - qualcomm-ipq807x
          - mediatek-filogic
      release:
        description: 'Xuất bản lên GitHub Releases'
        required: false
        default: true
        type: boolean

concurrency:
  group: duydoan-wrt-immortalwrt-24-${{ inputs.target || 'all' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: write
  actions: write

jobs:
  plan:
    name: "Plan [immortalwrt-24] Matrix (${{ inputs.target || 'all' }})"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Generate Build Matrix for immortalwrt-24
        id: set-matrix
        env:
          TARGET: ${{ inputs.target || 'all' }}
        run: |
          python3 - << 'PYEOF' > matrix.json
          import json, os

          target = os.environ.get("TARGET", "all")
          branch_ref = "immortalwrt-24"
          prefix = "Duydoan-24.10"
          badge = " [Không PassWall]"

          items = [
              {
                  "ref": branch_ref,
                  "id": "qualcomm-ipq60xx",
                  "title": f"Qualcomm IPQ60xx (NSS 12.5){badge}",
                  "job_title": f"[immortalwrt-24] Qualcomm IPQ60xx (NSS 12.5){badge}",
                  "config": "qualcomm_ipq60xx_all.config",
                  "target_dir": "bin/targets/qualcommax/ipq60xx",
                  "tag_prefix": f"{prefix}-Qualcomm-IPQ60xx-All",
                  "release_title": f"[immortalwrt-24] Duydoan-24.10 Qualcomm IPQ60xx (Full-NSS 12.5){badge} Unified All-Devices Release",
                  "copy_itb_to_bin": False
              },
              {
                  "ref": branch_ref,
                  "id": "qualcomm-ipq807x",
                  "title": f"Qualcomm IPQ807x (NSS 12.5){badge}",
                  "job_title": f"[immortalwrt-24] Qualcomm IPQ807x (NSS 12.5){badge}",
                  "config": "qualcomm_ipq807x_all.config",
                  "target_dir": "bin/targets/qualcommax/ipq807x",
                  "tag_prefix": f"{prefix}-Qualcomm-IPQ807x-All",
                  "release_title": f"[immortalwrt-24] Duydoan-24.10 Qualcomm IPQ807x (Full-NSS 12.5){badge} Unified All-Devices Release",
                  "copy_itb_to_bin": False
              },
              {
                  "ref": branch_ref,
                  "id": "mediatek-filogic",
                  "title": f"MediaTek Filogic (MT7981/7986/7988 HNAT){badge}",
                  "job_title": f"[immortalwrt-24] MediaTek Filogic (MT7981/7986/7988 HNAT){badge}",
                  "config": "mediatek_filogic_all.config",
                  "target_dir": "bin/targets/mediatek/filogic",
                  "tag_prefix": f"{prefix}-MediaTek-Filogic-All",
                  "release_title": f"[immortalwrt-24] Duydoan-24.10 MediaTek Filogic (HNAT/Offload){badge} Unified All-Devices Release",
                  "copy_itb_to_bin": True
              }
          ]

          if target == "all":
              selected = items
          elif target == "qualcomm-ipq":
              selected = [t for t in items if t["id"].startswith("qualcomm-")]
          else:
              selected = [t for t in items if t["id"] == target]

          print(json.dumps({"include": selected}))
          PYEOF
          MATRIX=$(cat matrix.json)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Selected branch=immortalwrt-24 target=$TARGET matrix=$MATRIX"

  build:
    name: "Build ${{ matrix.job_title }}"
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout Branch (immortalwrt-24)
        uses: actions/checkout@v5
        with:
          ref: immortalwrt-24

      - name: Free Disk, Mount /mnt SSD & Install Build Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          sudo docker system prune -af --volumes || true
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y --no-install-recommends \
            autoconf automake autopoint bc binutils bison build-essential bzip2 ca-certificates \
            ccache clang cmake cpio curl device-tree-compiler dos2unix file flex gawk gettext \
            gcc-multilib g++-multilib genisoimage git gperf help2man intltool jq \
            libbpf-dev libc6-dev-i386 libclang-dev libdw-dev libelf-dev libglib2.0-dev \
            libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libreadline-dev \
            libssl-dev libtool lld llvm ninja-build p7zip p7zip-full patch perl pkgconf \
            python3 python3-cryptography python3-dev python3-docutils python3-packaging \
            python3-pip python3-ply python3-pyelftools python3-setuptools qemu-utils re2c \
            rsync squashfs-tools subversion swig texinfo unzip wget xmlto xxd xz-utils \
            zlib1g-dev zstd
          sudo timedatectl set-timezone "Asia/Ho_Chi_Minh"

          sudo mkdir -p /mnt/build_wrt/.ccache /mnt/build_wrt/build_dir /mnt/build_wrt/staging_dir /mnt/build_wrt/dl
          sudo chown -R "$USER:$USER" /mnt/build_wrt
          for d in .ccache build_dir staging_dir dl; do
            rm -rf "$GITHUB_WORKSPACE/$d"
            ln -sfn "/mnt/build_wrt/$d" "$GITHUB_WORKSPACE/$d"
          done

          python3 - << 'PYEOF'
          import json, os, re
          mf = "scripts/projectsmirrors.json"
          if os.path.isfile(mf):
              with open(mf, "r", encoding="utf-8") as f:
                  data = json.load(f)
              bad = re.compile(r"(\.cn/|tencent|aliyun)", re.I)
              for k, v in list(data.items()):
                  if isinstance(v, list):
                      filtered = [u for u in v if not bad.search(str(u))]
                      if filtered:
                          data[k] = filtered
              with open(mf, "w", encoding="utf-8") as f:
                  json.dump(data, f, indent="\t")
                  f.write("\n")
          PYEOF
          df -h

      - name: Restore Build Cache (immortalwrt-24 / ${{ matrix.id }})
        id: cache-restore
        uses: actions/cache/restore@v5
        with:
          path: |
            /mnt/build_wrt/.ccache
            /mnt/build_wrt/staging_dir/host*
            /mnt/build_wrt/staging_dir/tool*
          key: wrt-immortalwrt-24-${{ matrix.id }}-${{ hashFiles('tools/**', 'toolchain/**', 'feeds.conf.default', matrix.config) }}
          restore-keys: |
            wrt-immortalwrt-24-${{ matrix.id }}-

      - name: Prepare Restored Build Cache
        if: steps.cache-restore.outputs.cache-matched-key != ''
        run: |
          find /mnt/build_wrt/staging_dir -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
            find "$DIR" -type f -exec touch {} +
          done
          mkdir -p tmp
          echo "1" > tmp/.build

      - name: Prepare Feeds & Driver Compatibility Patches
        run: |
          chmod +x scripts/ci-prepare.sh .github/scripts/*.sh
          ./scripts/ci-prepare.sh

      - name: Load Seed Config & Hardware Offload (immortalwrt-24 / ${{ matrix.id }})
        run: |
          cp "${{ matrix.config }}" .config
          sed -i '/wwand-datapath-rmnet_nss/d' .config
          echo "CONFIG_CCACHE=y" >> .config

          if [ "${{ matrix.id }}" = "qualcomm-ipq60xx" ] || [ "${{ matrix.id }}" = "qualcomm-ipq807x" ]; then
            echo ">> [NSS 12.5 ACCELERATION] Kích hoạt Qualcomm Full-NSS & ECM Engine cho ${{ matrix.id }}..."
            sed -i '/luci-app-turboacc/d; /TURBOACC_INCLUDE_/d' .config
            cat << 'EOF' >> .config
          CONFIG_FEED_nss_packages=y
          CONFIG_PACKAGE_kmod-qca-nss-dp=y
          CONFIG_PACKAGE_kmod-qca-nss-drv=y
          CONFIG_PACKAGE_kmod-qca-nss-ecm=y
          CONFIG_PACKAGE_kmod-qca-nss-drv-pppoe=y
          CONFIG_PACKAGE_kmod-qca-nss-drv-bridge-mgr=y
          CONFIG_PACKAGE_kmod-qca-nss-drv-vlan-mgr=y
          CONFIG_PACKAGE_kmod-qca-nss-drv-qdisc=y
          CONFIG_PACKAGE_kmod-nss-ifb=y
          CONFIG_PACKAGE_nss-utils=y
          CONFIG_PACKAGE_nss-firmware=y
          # CONFIG_PACKAGE_luci-app-turboacc is not set
          CONFIG_PACKAGE_kmod-tcp-bbr=y
          EOF
            if [ "${{ matrix.id }}" = "qualcomm-ipq807x" ]; then
              cat << 'EOF' >> .config
          CONFIG_PACKAGE_nss-firmware-ipq807x=y
          CONFIG_PACKAGE_kmod-pcie_mhi_nss=y
          CONFIG_PACKAGE_kmod-qmi_wwan_q_nss=y
          # Ensure Qualcomm NSS & PCIe MHI/QMI 5G kernel drivers are enabled without QModem
          echo "CONFIG_PACKAGE_kmod-qca-nss-drv=y" >> .config
          echo "CONFIG_PACKAGE_kmod-qca-nss-ecm=y" >> .config
          echo "# CONFIG_PACKAGE_luci-app-qmodem is not set" >> .config
          echo "# CONFIG_PACKAGE_qmodem is not set" >> .config
          EOF
            else
              sed -i '/pcie_mhi_nss/d; /qmi_wwan_q_nss/d; /nss-qmi-wwan/d; /NSS_MHI_PCIe_DRIVER/d' .config
              echo "CONFIG_PACKAGE_nss-firmware-ipq60xx=y" >> .config
            fi
          fi

          if [ "${{ matrix.id }}" = "mediatek-filogic" ]; then
            echo ">> [PPE/WED ACCELERATION] Kích hoạt MediaTek MT798x PPE, WED & bridger..."
            sed -i '/kmod-mediatek_hnat/d; /luci-app-turboacc-mtk/d; /MTK_SCS_FW_OFFLOAD/d; /MTK_WHNAT_SUPPORT/d; /TURBOACC_INCLUDE_/d' .config
            if grep -q 'KERNEL_PATCHVER:=6.6' target/linux/mediatek/Makefile 2>/dev/null; then
              sed -i '/_DEVICE_.*\(glinet_gl-mt3600be\|bananapi_bpi-r4-lite\|hiveton_h5000m\|mediatek_mt7987a-rfb\|routerich_be7200\)/d; /mt7987-2p5g-phy-firmware/d; /trusted-firmware-a-mt7987/d' .config
            fi
            cat << 'EOF' >> .config
          CONFIG_PACKAGE_bridger=y
          CONFIG_PACKAGE_kmod-nft-offload=y
          CONFIG_PACKAGE_kmod-nf-flow=y
          CONFIG_PACKAGE_kmod-tcp-bbr=y
          EOF
          fi

          echo ">> [NO-PASSWALL] Nhánh immortalwrt-24 giữ bản thuần sạch (Không PassWall)..."
          sed -i '/luci-app-passwall/d' .config
          echo "# CONFIG_PACKAGE_luci-app-passwall is not set" >> .config

          echo "CONFIG_PACKAGE_luci-app-doanduy-modem=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-base-vi=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-firewall-vi=y" >> .config
          echo "CONFIG_PACKAGE_curl=y" >> .config
          echo "CONFIG_PACKAGE_wget-ssl=y" >> .config

          bash .github/scripts/prepare-build-host.sh
          bash .github/scripts/inject-common-kmods.sh
          make defconfig
          if ! grep -q '^CONFIG_PACKAGE_luci-app-doanduy-modem=y$' .config; then
            echo "::error::CRITICAL — luci-app-doanduy-modem=y dropped by make defconfig!" >&2
            exit 1
          fi
          if grep -q '^CONFIG_USE_LLVM_BUILD=y$' .config; then
            echo "ERROR: CONFIG_USE_LLVM_BUILD=y still active — host LLVM BPF override failed!" >&2
            exit 1
          fi
          bash .github/scripts/prepare-rust.sh
          echo ">> [immortalwrt-24] Active target devices count: $(grep -c '^CONFIG_TARGET_DEVICE_.*=y$' .config || echo 0)"

      - name: Download Package Sources
        run: |
          make download -j$(nproc)
          find dl/ -size -1024c -exec ls -l {} \;
          find dl/ -size -1024c -exec rm -f {} \;

      - name: Compile Firmware (immortalwrt-24 / ${{ matrix.id }})
        id: compile
        env:
          CCACHE_DIR: /mnt/build_wrt/.ccache
          CCACHE_MAXSIZE: 1.5G
          CCACHE_COMPRESS: 1
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          echo -e "$(nproc) thread compile for [immortalwrt-24] ${{ matrix.title }}"
          make -j$(nproc) || make -j1 V=s
          ccache -s || true
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Save Build Cache (immortalwrt-24 / ${{ matrix.id }})
        if: success() && steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          key: wrt-immortalwrt-24-${{ matrix.id }}-${{ hashFiles('tools/**', 'toolchain/**', 'feeds.conf.default', matrix.config) }}
          path: |
            /mnt/build_wrt/.ccache
            /mnt/build_wrt/staging_dir/host*
            /mnt/build_wrt/staging_dir/tool*

      - name: Prepare & Clean Firmware Artifacts
        id: organize
        if: steps.compile.outputs.status == 'success'
        run: |
          cd "${{ matrix.target_dir }}"
          rm -rf packages kernel-debug.tar.zst
          if [ "${{ matrix.copy_itb_to_bin }}" = "true" ]; then
            for itb in *sysupgrade.itb; do
              [ -f "$itb" ] && [ ! -f "${itb%.itb}.bin" ] && cp -f "$itb" "${itb%.itb}.bin"
            done
          fi
          echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date +'%Y.%m.%d-%H%M')" >> "$GITHUB_ENV"
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Generate Dynamic Release Notes (Verified from profiles.json & manifest)
        if: steps.organize.outputs.status == 'success' && (github.event_name != 'workflow_dispatch' || inputs.release != false)
        env:
          MATRIX_TITLE: ${{ matrix.title }}
          MATRIX_RELEASE_TITLE: ${{ matrix.release_title }}
        run: |
          python3 - << 'PYEOF'
          import glob, json, os, re

          fw_dir = os.environ["FIRMWARE"]
          title = os.environ["MATRIX_TITLE"]
          rel_title = os.environ.get("MATRIX_RELEASE_TITLE", title)
          build_date = os.environ["BUILD_DATE"]
          profiles_path = os.path.join(fw_dir, "profiles.json")
          profiles = []
          if os.path.isfile(profiles_path):
              with open(profiles_path, "r", encoding="utf-8") as f:
                  data = json.load(f)
              profiles = sorted(data.get("profiles", {}).keys())

          mf_pkgs = set()
          kernel_ver = ""
          for mf in glob.glob(os.path.join(fw_dir, "*.manifest")):
              with open(mf, "r", encoding="utf-8", errors="replace") as f:
                  for ln in f:
                      pkg, _, ver = ln.partition(" - ")
                      pkg = pkg.strip()
                      if pkg:
                          mf_pkgs.add(pkg)
                          if pkg == "kernel" and ver.strip() and not kernel_ver:
                              m_k = re.match(r"(\d+\.\d+\.\d+)", ver.strip())
                              if m_k:
                                  kernel_ver = m_k.group(1)

          core_pkgs = ("luci-app-passwall", "luci-app-passwall2", "xray-core", "xray-plugin", "sing-box", "chinadns-ng", "haproxy")
          has_pw = ("luci-app-passwall" in mf_pkgs) or ("luci-app-passwall2" in mf_pkgs)
          has_modem = "luci-app-doanduy-modem" in mf_pkgs
          found_cores = [p for p in core_pkgs if p in mf_pkgs]
          if has_pw:
              actual_badge = "[Có PassWall]"
              pw_line = f"✅ **CÓ tích hợp PassWall** (`{', '.join(found_cores)}`)"
          else:
              actual_badge = "[Không PassWall]"
              pw_line = "❌ **KHÔNG tích hợp PassWall** (Bản Thuần / No-PassWall)"

          accel_parts = []
          if "qca-nss-ecm" in mf_pkgs or "kmod-qca-nss-ecm" in mf_pkgs:
              nss_mods = [m.replace("kmod-qca-nss-drv-", "") for m in ("kmod-qca-nss-drv-pppoe", "kmod-qca-nss-drv-bridge-mgr", "kmod-qca-nss-drv-vlan-mgr", "kmod-qca-nss-drv-qdisc") if m in mf_pkgs]
              accel_parts.append(f"Qualcomm Full-NSS 12.5 (`{', '.join(nss_mods) if nss_mods else 'ECM'}`)")
          if "bridger" in mf_pkgs:
              accel_parts.append("MediaTek PPE + WED + `bridger`")
          accel_line = " + ".join(accel_parts) if accel_parts else "Mainline NFTables Hardware/Software Flow Offload + BBR"

          clean_rel = re.sub(r"\s*\[(Có PassWall|Không PassWall|Passwall)\]", "", rel_title).strip()
          if "Unified All-Devices Release" in clean_rel:
              final_rel_title = clean_rel.replace("Unified All-Devices Release", f"{actual_badge} Unified All-Devices Release", 1)
          else:
              final_rel_title = f"{clean_rel} {actual_badge}"

          gh_env = os.environ.get("GITHUB_ENV")
          if gh_env:
              with open(gh_env, "a", encoding="utf-8") as ef:
                  ef.write(f"FINAL_RELEASE_TITLE={final_rel_title}\n")

          k_label = f"Kernel {kernel_ver}" if kernel_ver else "24.10 Kernel 6.6"
          modem_line = "✅ `luci-app-doanduy-modem` v2.5.0+ (tích hợp sẵn trong ROM, không dùng file `all` cũ)" if has_modem else "⚠️ Chưa phát hiện trong manifest"
          clean_title = re.sub(r"\s*\[(Có PassWall|Không PassWall|Passwall)\]", "", title).strip()
          lines = [
              f"### 🚀 [immortalwrt-24] {clean_title} {actual_badge} — Duydoan-24.10 ({build_date})",
              "",
              f"* **Source Branch**: `immortalwrt-24`",
              f"* **Base Version**: ImmortalWrt 24.10 Stable (OPKG) ({k_label})",
              f"* **PassWall**: {pw_line}",
              f"* **Modem 5G & SmartHome Suite**: {modem_line}",
              f"* **Hardware Acceleration**: {accel_line}",
              f"* **Compilation Mode**: Unified Multi-Target Matrix Build (**{len(profiles)} thiết bị được biên dịch & xác thực thực tế**)",
              f"* **Default Theme**: LuCI Argon (Tiếng Việt + Argon Config đầy đủ)",
              "",
              f"#### 📱 Danh Sách {len(profiles)} Thiết Bị Trong Bản Phát Hành Này:",
          ]
          for p in profiles:
              lines.append(f"- `{p}`")

          with open("release_notes.md", "w", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")
          PYEOF

      - name: Upload Firmware to Actions Artifacts
        uses: actions/upload-artifact@v6
        if: steps.organize.outputs.status == 'success' && github.event_name == 'workflow_dispatch' && inputs.release == false
        with:
          name: ${{ matrix.tag_prefix }}_${{ env.BUILD_DATE }}
          path: ${{ env.FIRMWARE }}/*
          retention-days: 3

      - name: Create GitHub Release (Batched & Rate-Limit Resilient)
        if: steps.organize.outputs.status == 'success' && (github.event_name != 'workflow_dispatch' || inputs.release != false)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ matrix.tag_prefix }}-${{ env.BUILD_DATE }}
          RELEASE_TITLE: ${{ env.FINAL_RELEASE_TITLE }} ${{ env.BUILD_DATE }}
          RELEASE_NOTES_FILE: release_notes.md
          FIRMWARE_DIR: ${{ env.FIRMWARE }}
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/publish-release.py"

  cache-rollover:
    name: "Roll Old [immortalwrt-24] Caches"
    needs: [plan, build]
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Prune Superseded Caches for immortalwrt-24
        run: |
          set -euo pipefail
          for tid in qualcomm-ipq60xx qualcomm-ipq807x mediatek-filogic; do
            prefix="wrt-immortalwrt-24-${tid}-"
            kept=0
            while IFS=$'\t' read -r cid ckey; do
              [ -n "$cid" ] || continue
              if [ "$kept" -eq 0 ]; then
                kept=1
                continue
              fi
              gh cache delete "$cid" --repo "$GH_REPO" || true
            done < <(gh cache list --repo "$GH_REPO" --key "$prefix" --sort created_at --order desc --limit 50 --json id,key --jq '.[] | [.id, .key] | @tsv')
          done

  hermes_audit:
    name: "Hermes Sentinel Report [immortalwrt-24] [Không PassWall]"
    needs: [plan, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Signal Debian VM Hermes Sentinel (Build Completed)
        id: vm_signal
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          BRANCH: "immortalwrt-24"
          WORKFLOW_NAME: ${{ github.workflow }}
          VM_WEBHOOK_URL: ${{ secrets.VM_WEBHOOK_URL }}
          VM_WEBHOOK_SECRET: ${{ secrets.VM_WEBHOOK_SECRET }}
        run: |
          python3 - << 'PYEOF'
          import hashlib, hmac, json, os, time, urllib.request
          out_path = os.environ.get("GITHUB_OUTPUT", "")
          def set_out(k, v):
              if out_path:
                  with open(out_path, "a", encoding="utf-8") as f:
                      f.write(f"{k}={v}\n")
          url = os.environ.get("VM_WEBHOOK_URL", "").strip()
          if not url:
              set_out("delivered", "false")
              raise SystemExit(0)
          secret = os.environ.get("VM_WEBHOOK_SECRET", "").strip().encode("utf-8")
          repo = os.environ.get("REPO", "")
          run_id = os.environ.get("RUN_ID", "")
          delivered = False
          for attempt in range(1, 4):
              payload = {
                  "event": "build_completed",
                  "repo": repo,
                  "run_id": run_id,
                  "branch": "immortalwrt-24",
                  "workflow": os.environ.get("WORKFLOW_NAME", ""),
                  "result": os.environ.get("BUILD_RESULT", "unknown"),
                  "run_url": f"https://github.com/{repo}/actions/runs/{run_id}",
                  "ts": int(time.time()),
              }
              body = json.dumps(payload, separators=(",", ":")).encode("utf-8")
              headers = {"Content-Type": "application/json"}
              if secret:
                  sig = hmac.new(secret, body, hashlib.sha256).hexdigest()
                  headers["X-Sentinel-Signature"] = f"sha256={sig}"
              try:
                  req = urllib.request.Request(url, data=body, headers=headers, method="POST")
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      if 200 <= resp.status < 300:
                          delivered = True
                          break
              except Exception:
                  if attempt < 3:
                      time.sleep(5)
          set_out("delivered", "true" if delivered else "false")
          PYEOF

      - name: Fallback Direct Telegram (Only if VM Webhook Unreachable)
        if: steps.vm_signal.outputs.delivered != 'true'
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python3 - << 'PYEOF'
          import os, json, urllib.request
          tg_token = os.environ.get("TG_BOT_TOKEN", "").strip()
          tg_chat_id = os.environ.get("TG_CHAT_ID", "").strip()
          if not tg_token or not tg_chat_id:
              raise SystemExit(0)
          result = os.environ.get("BUILD_RESULT", "unknown")
          run_id = os.environ.get("RUN_ID", "")
          repo = os.environ.get("REPO", "")
          emoji = "✅" if result == "success" else "⚠️"
          msg = f"{emoji} <b>[immortalwrt-24] BUILD {result.upper()} (24.10 Kernel 6.6) [Không PassWall]</b>\n📌 <a href='https://github.com/{repo}/actions/runs/{run_id}'>{run_id}</a>"
          try:
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{tg_token}/sendMessage",
                  data=json.dumps({"chat_id": tg_chat_id, "text": msg, "parse_mode": "HTML"}).encode("utf-8"),
                  headers={"Content-Type": "application/json"}
              )
              urllib.request.urlopen(req, timeout=10)
          except Exception:
              pass
          PYEOF
# [/VERIFIED-GOLDEN]
