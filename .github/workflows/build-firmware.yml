name: Build Duydoan-24.10 JDCloud RE-CS-02

on:
  schedule:
    - cron: '0 0 * * *'  # 7:00 AM Asia/Ho_Chi_Minh daily (00:00 UTC)
  workflow_dispatch:
    inputs:
      release:
        description: 'Upload firmware to GitHub Release'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  REPO_URL: https://github.com/Doanduy09/JDCloud-RE-CS-02
  DEVICE_TARGET: qualcommax
  DEVICE_SUBTARGET: ipq60xx
  DEVICE_PROFILE: DEVICE_jdcloud_re-cs-02
  CONFIG_FILE: jdcloud_re-cs-02-nss.config
  TZ: Asia/Ho_Chi_Minh

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Initialize Build Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
            git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz \
            mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply \
            python3-docutils qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl \
            unzip vim wget xmlto xxd zlib1g-dev zstd
          sudo timedatectl set-timezone "$TZ"

      - name: Update and Install Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load Seed Config
        run: |
          [ -e $CONFIG_FILE ] && cp $CONFIG_FILE .config
          make defconfig

      - name: Download Package Sources
        run: |
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile Firmware
        id: compile
        run: |
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Prepare Firmware Artifacts
        id: organize
        if: steps.compile.outputs.status == 'success'
        run: |
          cd bin/targets/$DEVICE_TARGET/$DEVICE_SUBTARGET
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload Firmware to Actions Artifacts
        uses: actions/upload-artifact@v4
        if: steps.organize.outputs.status == 'success'
        with:
          name: Duydoan-24.10_JDCloud_RE-CS-02_${{ env.BUILD_DATE }}
          path: ${{ env.FIRMWARE }}/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: steps.organize.outputs.status == 'success' && (inputs.release == true || github.event_name == 'schedule')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: Duydoan-24.10-RE-CS-02-${{ env.BUILD_DATE }}
          name: Duydoan-24.10 JDCloud RE-CS-02 Release ${{ env.BUILD_DATE }}
          body: |
            ### Duydoan-24.10 for JDCloud RE-CS-02 (Athena AX6600)
            * **Base Version**: Duydoan-24.10 (LTS Kernel 6.6)
            * **Target Hardware**: JDCloud RE-CS-02 (Qualcomm IPQ6010 / IPQ6000)
            * **Qualcomm NSS 12.5**: Hardware Offload for IPv4/IPv6, PPPoE, Bridge, VLAN, and Cellular Modems (MBIM, QMI, XMM, ModemManager).
            * **eMMC Storage**: Auto-expands partition 27 (64GB/128GB F2FS) to `/mnt/storage` with `/opt` and `/docker` links.
            * **Wi-Fi 6 Tri-Band**: 2.4G + 5.2G + 5.8G 160MHz (QCN9074).
            * **LED Control**: Integrated `luci-app-athena-led` for Athena LED matrix screen control.
            * **SQM**: Removed to guarantee zero latency and full NSS hardware acceleration.
          files: ${{ env.FIRMWARE }}/*
