name: Build Duydoan-25.12 Swaiot S10-SKY (Bleeding Edge)

on:
  schedule:
    # 05:45 AM Asia/Ho_Chi_Minh daily (22:45 UTC)
    - cron: '45 22 * * *'
  workflow_dispatch:
    inputs:
      release:
        description: 'Upload firmware to GitHub Release'
        required: false
        default: true
        type: boolean

permissions: write-all

jobs:
  build:
    name: Build Swaiot S10-SKY (25.12)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: openwrt-25

      - name: Initialize Build Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
            git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz \
            mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply \
            python3-docutils qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl \
            unzip vim wget xmlto xxd zlib1g-dev zstd
          sudo timedatectl set-timezone "Asia/Ho_Chi_Minh"

      - name: Update and Install Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          sed -i 's/^int qma_setting_store(/static int qma_setting_store(/' feeds/all/fibocom_QMI_WWAN/src/qmi_wwan_f.c || true
          sed -i 's/^struct sk_buff \*qmi_wwan_tx_fixup(/static struct sk_buff *qmi_wwan_tx_fixup(/' feeds/all/simcom_QMI_WWAN/src/qmi_wwan_s.c || true
          sed -i 's/CXXFLAGS="$(TARGET_CXXFLAGS)"/CXXFLAGS="$(TARGET_CXXFLAGS)" \\\n\tEXTRA_CFLAGS="-Wno-error=missing-prototypes -Wno-error=incompatible-pointer-types"/' feeds/all/fibocom_QMI_WWAN/Makefile feeds/all/simcom_QMI_WWAN/Makefile || true

      - name: Load Custom Configuration
        run: |
          [ -e swaiot_s10sky.config ] && cp -f swaiot_s10sky.config .config
          make defconfig

      - name: Download Package Dependencies
        run: |
          make download -j8 || make download -j1 V=s

      - name: Compile Firmware
        id: compile
        run: |
          echo -e "$(nproc) thread compile for Swaiot S10-SKY (25.12)"
          make -j$(nproc) || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Prepare Firmware Artifacts
        id: organize
        if: steps.compile.outputs.status == 'success'
        run: |
          cd bin/targets/qualcommax/ipq807x
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload Firmware to Actions Artifacts
        uses: actions/upload-artifact@v4
        if: steps.organize.outputs.status == 'success'
        with:
          name: Duydoan-25.12_Swaiot_S10-SKY_${{ env.BUILD_DATE }}
          path: ${{ env.FIRMWARE }}/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: steps.organize.outputs.status == 'success' && (inputs.release != false)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: Duydoan-25.12-Swaiot-S10-SKY-${{ env.BUILD_DATE }}
          name: Duydoan-25.12 Swaiot S10-SKY Release ${{ env.BUILD_DATE }}
          body: |
            ### 🚀 Duydoan-25.12 (Bleeding Edge) for Swaiot S10-SKY
            * **Base Version**: ImmortalWrt 25.12 (Bleeding Edge)
            * **Target Architecture**: Qualcomm IPQ8071 / IPQ8074 (`qualcommax/ipq807x`)
            * **Hardware Specs**:
              - SoC: Qualcomm IPQ8071 (Quad-Core ARM Cortex-A53)
              - RAM: 1GB DDR4
              - Flash: 16MB SPI-NOR + 256MB QPIC NAND
              - Ethernet: QCA8075 + QCA8081 (2.5GbE PHY)
              - Wi-Fi: Qualcomm ath11k 4x4 5GHz + 2x2 2.4GHz Wi-Fi 6
            * **Firmware Files**:
              - `*swaiot_s10sky-squashfs-factory.ubi`: Dành cho nạp lần đầu từ Stock qua U-Boot / Web Failsafe.
              - `*swaiot_s10sky-squashfs-sysupgrade.bin`: Nâng cấp trực tiếp qua LuCI Web UI.
              - `*swaiot_s10sky-initramfs-uImage.itb`: Dành cho boot cứu hộ qua TFTP / U-Boot.
            * **Highlights**:
              - Giao diện mặc định: Argon Theme v2.4.7 (chuyển đổi On-Demand linh hoạt).
              - Qualcomm NSS Hardware Acceleration hỗ trợ tối đa hiệu năng định tuyến.
          files: ${{ env.FIRMWARE }}/*
