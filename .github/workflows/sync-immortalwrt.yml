# SPDX-License-Identifier: MIT
# Automated Upstream Sync Workflow: Safely merges ImmortalWrt 24.10, 25.12, and master while protecting all Doanduy custom hardware & configs

name: Sync Upstream ImmortalWrt (All Branches)

on:
  schedule:
    # Đồng bộ định kỳ 2 lần/ngày (01:00 & 13:00 VN = 18:00 & 06:00 UTC)
    - cron: '11 6,18 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Ép buộc kích hoạt Unified Matrix Build dù không có commit mới'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

jobs:
  sync_master:
    name: Sync master with upstream immortalwrt:openwrt-25.12
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Branch master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Configure Git Identity
        run: |
          git config user.name "Doanduy09-Bot"
          git config user.email "doanduy09@gmail.com"
          git checkout -B master origin/master

      - name: Check and Sync Upstream ImmortalWrt 25.12
        id: sync_check
        run: |
          git remote add upstream https://github.com/immortalwrt/immortalwrt.git || git remote set-url upstream https://github.com/immortalwrt/immortalwrt.git
          git fetch upstream openwrt-25.12 --depth=100

          UPSTREAM_SHA=$(git rev-parse upstream/openwrt-25.12)
          LOCAL_SHA=$(git rev-parse HEAD)
          echo "Upstream 25.12 latest commit: $UPSTREAM_SHA"
          echo "Local master commit: $LOCAL_SHA"

          if git merge-base --is-ancestor upstream/openwrt-25.12 HEAD; then
            echo ">> [ALREADY UP-TO-DATE] Nhánh master đã đồng bộ hoàn toàn."
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          else
            echo ">> [NEW UPDATES DETECTED] Đang hợp nhất upstream/openwrt-25.12..."
            echo "has_updates=true" >> "$GITHUB_OUTPUT"

            if git merge upstream/openwrt-25.12 -m "sync: auto-merge upstream immortalwrt:openwrt-25.12 ($UPSTREAM_SHA)"; then
              echo ">> Hợp nhất không xung đột!"
            else
              echo ">> Phát hiện xung đột — bảo lưu 100% cấu hình & thiết bị đặc thù Doanduy..."
              PROTECTED_FILES=(
                "mediatek_filogic_all.config"
                "qualcomm_ipq60xx_all.config"
                "qualcomm_ipq807x_all.config"
                "feeds.conf.default"
                "scripts/ci-prepare.sh"
                "scripts/hermes_lab_auto_runner.js"
                "scripts/qmodem_manager.sh"
                "package/base-files/files/etc/duydoan_wwan_matrix.json"
                "package/base-files/files/etc/init.d/all.enc"
                "target/linux/mediatek/image/filogic.mk"
                "target/linux/mediatek/dts/mt7981b-wirelesstag-zx7981pd.dts"
                "target/linux/mediatek/dts/mt7981b-viettel-nr3053.dts"
                "target/linux/mediatek/dts/mt7981b-sdmc-mt3053.dts"
                "target/linux/qualcommax/image/ipq60xx.mk"
                "target/linux/qualcommax/image/ipq807x.mk"
                "package/firmware/ipq-wifi/Makefile"
                ".github/workflows/build-25-unified-matrix.yml"
                ".github/workflows/Auto-Clean.yml"
                ".github/workflows/sync-immortalwrt.yml"
              )
              for pf in "${PROTECTED_FILES[@]}"; do
                git checkout --ours "$pf" 2>/dev/null || true
              done
              git rm -f --cached package/base-files/files/etc/init.d/all 2>/dev/null || true
              git add -A
              git commit -m "sync: resolve merge conflicts preserving Doanduy hardware & configs" || true
            fi

            git push origin master
            echo ">> Đã đẩy cập nhật thành công lên master!"
          fi

      - name: Trigger Unified Matrix Build (When New Updates Exist on master)
        if: (steps.sync_check.outputs.has_updates == 'true' || inputs.force_build == true) && !cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo ">> Kích hoạt build Unified Matrix cho cả 3 nền tảng (master)..."
          gh workflow run "build-25-unified-matrix.yml" --repo "${{ github.repository }}" -r master -f target=all || true

  sync_immortalwrt_24:
    name: Sync immortalwrt-24 with upstream immortalwrt:openwrt-24.10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Branch immortalwrt-24
        uses: actions/checkout@v4
        with:
          ref: immortalwrt-24
          fetch-depth: 0

      - name: Configure Git Identity
        run: |
          git config user.name "Doanduy09-Bot"
          git config user.email "doanduy09@gmail.com"
          git checkout -B immortalwrt-24 origin/immortalwrt-24

      - name: Check and Sync Upstream ImmortalWrt 24.10
        id: sync_check
        run: |
          git remote add upstream https://github.com/immortalwrt/immortalwrt.git || git remote set-url upstream https://github.com/immortalwrt/immortalwrt.git
          git fetch upstream openwrt-24.10 --depth=100

          UPSTREAM_SHA=$(git rev-parse upstream/openwrt-24.10)
          LOCAL_SHA=$(git rev-parse HEAD)
          echo "Upstream 24.10 latest commit: $UPSTREAM_SHA"
          echo "Local immortalwrt-24 commit: $LOCAL_SHA"

          if git merge-base --is-ancestor upstream/openwrt-24.10 HEAD; then
            echo ">> [ALREADY UP-TO-DATE] Nhánh immortalwrt-24 đã đồng bộ hoàn toàn."
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          else
            echo ">> [NEW UPDATES DETECTED] Đang hợp nhất upstream/openwrt-24.10..."
            echo "has_updates=true" >> "$GITHUB_OUTPUT"

            if git merge upstream/openwrt-24.10 -m "sync: auto-merge upstream immortalwrt:openwrt-24.10 ($UPSTREAM_SHA)"; then
              echo ">> Hợp nhất không xung đột!"
            else
              echo ">> Phát hiện xung đột — bảo lưu 100% cấu hình & thiết bị đặc thù Doanduy..."
              PROTECTED_FILES=(
                "mediatek_filogic_all.config"
                "qualcomm_ipq60xx_all.config"
                "qualcomm_ipq807x_all.config"
                "feeds.conf.default"
                "scripts/ci-prepare.sh"
                "scripts/hermes_lab_auto_runner.js"
                "scripts/qmodem_manager.sh"
                "package/base-files/files/etc/duydoan_wwan_matrix.json"
                "package/base-files/files/etc/init.d/all.enc"
                "target/linux/mediatek/image/filogic.mk"
                "target/linux/mediatek/dts/mt7981b-wirelesstag-zx7981pd.dts"
                "target/linux/mediatek/dts/mt7981b-viettel-nr3053.dts"
                "target/linux/mediatek/dts/mt7981b-sdmc-mt3053.dts"
                "target/linux/qualcommax/image/ipq60xx.mk"
                "target/linux/qualcommax/image/ipq807x.mk"
                "package/firmware/ipq-wifi/Makefile"
                ".github/workflows/build-25-unified-matrix.yml"
                ".github/workflows/Auto-Clean.yml"
                ".github/workflows/sync-immortalwrt.yml"
              )
              for pf in "${PROTECTED_FILES[@]}"; do
                git checkout --ours "$pf" 2>/dev/null || true
              done
              git rm -f --cached package/base-files/files/etc/init.d/all 2>/dev/null || true
              git add -A
              git commit -m "sync: resolve merge conflicts preserving Doanduy hardware & configs" || true
            fi

            git push origin immortalwrt-24
            echo ">> Đã đẩy cập nhật thành công lên immortalwrt-24!"
          fi

  sync_immortalwrt_24_passwall:
    name: Sync immortalwrt-24-passwall with upstream immortalwrt:openwrt-24.10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Branch immortalwrt-24-passwall
        uses: actions/checkout@v4
        with:
          ref: immortalwrt-24-passwall
          fetch-depth: 0

      - name: Configure Git Identity
        run: |
          git config user.name "Doanduy09-Bot"
          git config user.email "doanduy09@gmail.com"
          git checkout -B immortalwrt-24-passwall origin/immortalwrt-24-passwall

      - name: Check and Sync Upstream ImmortalWrt 24.10
        id: sync_check
        run: |
          git remote add upstream https://github.com/immortalwrt/immortalwrt.git || git remote set-url upstream https://github.com/immortalwrt/immortalwrt.git
          git fetch upstream openwrt-24.10 --depth=100

          UPSTREAM_SHA=$(git rev-parse upstream/openwrt-24.10)
          if git merge-base --is-ancestor upstream/openwrt-24.10 HEAD; then
            echo ">> [ALREADY UP-TO-DATE] Nhánh immortalwrt-24-passwall đã đồng bộ hoàn toàn."
          else
            echo ">> [NEW UPDATES DETECTED] Đang hợp nhất upstream/openwrt-24.10..."
            if git merge upstream/openwrt-24.10 -m "sync: auto-merge upstream immortalwrt:openwrt-24.10 ($UPSTREAM_SHA)"; then
              echo ">> Hợp nhất không xung đột!"
            else
              echo ">> Bảo lưu 100% cấu hình & thiết bị Doanduy..."
              git checkout --ours feeds.conf.default *.config 2>/dev/null || true
              git add -A
              git commit -m "sync: resolve merge conflicts preserving Doanduy configs" || true
            fi
            git push origin immortalwrt-24-passwall
            echo ">> Đã đẩy cập nhật lên immortalwrt-24-passwall!"
          fi

  sync_master_passwall:
    name: Sync master-passwall with upstream immortalwrt:master
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Branch master-passwall
        uses: actions/checkout@v4
        with:
          ref: master-passwall
          fetch-depth: 0

      - name: Configure Git Identity
        run: |
          git config user.name "Doanduy09-Bot"
          git config user.email "doanduy09@gmail.com"
          git checkout -B master-passwall origin/master-passwall

      - name: Check and Sync Upstream ImmortalWrt Master
        id: sync_check
        run: |
          git remote add upstream https://github.com/immortalwrt/immortalwrt.git || git remote set-url upstream https://github.com/immortalwrt/immortalwrt.git
          git fetch upstream master --depth=100

          UPSTREAM_SHA=$(git rev-parse upstream/master)
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo ">> [ALREADY UP-TO-DATE] Nhánh master-passwall đã đồng bộ hoàn toàn."
          else
            echo ">> [NEW UPDATES DETECTED] Đang hợp nhất upstream/master..."
            if git merge upstream/master -m "sync: auto-merge upstream immortalwrt:master ($UPSTREAM_SHA)"; then
              echo ">> Hợp nhất không xung đột!"
            else
              echo ">> Bảo lưu 100% cấu hình & thiết bị Doanduy..."
              git checkout --ours feeds.conf.default *.config 2>/dev/null || true
              git add -A
              git commit -m "sync: resolve merge conflicts preserving Doanduy configs" || true
            fi
            git push origin master-passwall
            echo ">> Đã đẩy cập nhật lên master-passwall!"
          fi
