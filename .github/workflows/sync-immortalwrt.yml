# SPDX-License-Identifier: MIT
# Automated Upstream Sync Workflow: Safely merges ImmortalWrt 24.10 (Kernel 6.6) into 6.6 branches while protecting all Doanduy custom hardware, DTS, ucode & CI configs
# [VERIFIED-GOLDEN: upstream-sync-kernel-aligned | 2026-11-26 | DO NOT MODIFY UNLESS TARGETED]

name: Sync Upstream ImmortalWrt (All Branches)

on:
  schedule:
    # Đồng bộ định kỳ 2 lần/ngày (01:00 & 13:00 VN = 18:00 & 06:00 UTC)
    - cron: '0 18,6 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Ép buộc kích hoạt Unified Matrix Build dù không có commit mới'
        required: false
        default: false
        type: boolean

concurrency:
  group: duydoan-upstream-sync
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  sync_6_6_branches:
    name: Sync ${{ matrix.branch }} with upstream immortalwrt:${{ matrix.upstream_ref }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: master
            upstream_ref: openwrt-24.10
          - branch: master-passwall
            upstream_ref: openwrt-24.10
          - branch: immortalwrt-24
            upstream_ref: openwrt-24.10
          - branch: immortalwrt-24-passwall
            upstream_ref: openwrt-24.10
    steps:
      - name: Checkout Source Branch ${{ matrix.branch }}
        uses: actions/checkout@v5
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - name: Configure Git Identity
        run: |
          git config user.name "Doanduy09-Bot"
          git config user.email "doanduy09@gmail.com"
          git config pull.rebase false
          git checkout -B "${{ matrix.branch }}" "origin/${{ matrix.branch }}"

      - name: Check and Sync Upstream ImmortalWrt (${{ matrix.upstream_ref }})
        id: sync_check
        run: |
          set -euo pipefail
          BRANCH="${{ matrix.branch }}"
          UP_REF="${{ matrix.upstream_ref }}"
          PRE_MERGE_SHA=$(git rev-parse HEAD)

          git remote add upstream https://github.com/immortalwrt/immortalwrt.git 2>/dev/null || git remote set-url upstream https://github.com/immortalwrt/immortalwrt.git
          git fetch upstream "$UP_REF" --depth=200

          UPSTREAM_SHA=$(git rev-parse "upstream/$UP_REF")
          echo "Upstream $UP_REF latest commit: $UPSTREAM_SHA"
          echo "Local $BRANCH commit: $PRE_MERGE_SHA"

          if git merge-base --is-ancestor "upstream/$UP_REF" HEAD; then
            echo ">> [ALREADY UP-TO-DATE] Nhánh $BRANCH đã đồng bộ hoàn toàn với $UP_REF."
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo ">> [NEW UPDATES DETECTED] Đang hợp nhất upstream/$UP_REF vào $BRANCH..."
          echo "has_updates=true" >> "$GITHUB_OUTPUT"

          PROTECTED_PATHS=(
            "mediatek_filogic_all.config"
            "qualcomm_ipq60xx_all.config"
            "qualcomm_ipq807x_all.config"
            "feeds.conf.default"
            "scripts/ci-prepare.sh"
            "scripts/qmodem_manager.sh"
            "package/utils/ucode/Makefile"
            "package/firmware/ipq-wifi/Makefile"
            "package/base-files/files/etc/duydoan_wwan_matrix.json"
            "package/base-files/files/etc/init.d/all.enc"
            "target/linux/mediatek/Makefile"
            "target/linux/mediatek/image/filogic.mk"
            "target/linux/mediatek/image/filogic-ext.mk"
            "target/linux/mediatek/files-6.6/arch/arm64/boot/dts/mediatek/mt7981b.dtsi"
            "target/linux/mediatek/dts/mt7981b-wirelesstag-zx7981pd.dts"
            "target/linux/mediatek/dts/mt7981b-wirelesstag-zx7981pd-ubootmod.dts"
            "target/linux/mediatek/dts/mt7981b-viettel-nr3053.dts"
            "target/linux/mediatek/dts/mt7981b-sdmc-mt3053.dts"
            "target/linux/mediatek/dts/mt7981b-cudy-wr3000-nand.dtsi"
            "target/linux/mediatek/dts/mt7981b-zbtlink-zbt-z8103ax.dtsi"
            "target/linux/mediatek/dts/mt7986a-ruijie-rg-x60-new.dtsi"
            "target/linux/mediatek/dts/mt7987a-hiveton-h5000m.dts"
            "target/linux/mediatek/dts/mt7988d-asus-zenwifi-bt8.dtsi"
            "target/linux/mediatek/dts/mt7988d-keenetic-kn-1812.dtsi"
            "target/linux/mediatek/dts/mt7988d-tplink-be450.dts"
            "target/linux/mediatek/dts-ext/mt7981b-cudy-wr3000-nand.dtsi"
            "target/linux/mediatek/dts-ext/mt7981b-zbtlink-zbt-z8103ax.dtsi"
            "target/linux/mediatek/dts-ext/mt7988a-smartrg-mt-stuart.dtsi"
            "target/linux/mediatek/dts-ext/mt7988d-tplink-tl-7dr-common.dtsi"
            "package/base-files/files/etc/uci-defaults/99-custom-init.sh"
            "package/base-files/files/usr/bin/ati"
            "target/linux/qualcommax/Makefile"
            "target/linux/qualcommax/image/ipq60xx.mk"
            "target/linux/qualcommax/image/ipq807x.mk"
            ".github/workflows"
            ".github/scripts"
            "files"
          )

          MERGED_CLEAN=0
          if git merge --no-commit --no-ff "upstream/$UP_REF"; then
            MERGED_CLEAN=1
          else
            echo ">> Phát hiện xung đột — tự động bảo lưu 100% cấu hình & thiết bị đặc thù Doanduy..."
          fi

          # Always restore protected paths from PRE_MERGE_SHA even on clean merges so upstream never overwrites custom shims/configs
          for pf in "${PROTECTED_PATHS[@]}"; do
            if git cat-file -e "${PRE_MERGE_SHA}:${pf}" 2>/dev/null; then
              git checkout "$PRE_MERGE_SHA" -- "$pf" 2>/dev/null || true
            fi
          done

          # Never allow stale duplicate files that clash with luci-app-doanduy-modem or unencrypted init scripts
          git rm -f --ignore-unmatch \
            package/base-files/files/etc/init.d/all \
            package/base-files/files/etc/init.d/pcie_5g_dialer \
            package/base-files/files/etc/uci-defaults/patch_hnat.lua \
            package/base-files/files/etc/uci-defaults/99-qmodem-pcie \
            package/base-files/files/usr/bin/modem_autodial.sh \
            package/base-files/files/usr/bin/logall \
            package/base-files/files/lib/netifd/proto/duydoan5g.sh \
            package/base-files/files/www/luci-static/resources/protocol/duydoan5g.js 2>/dev/null || true

          # Abort safely if any unmerged conflict markers remain outside PROTECTED_PATHS
          UNMERGED=$(git diff --name-only --diff-filter=U || true)
          if [ -n "$UNMERGED" ]; then
            echo "::error::Unresolved merge conflicts outside PROTECTED_PATHS on $BRANCH: $UNMERGED" >&2
            git merge --abort || true
            exit 1
          fi

          git add -A
          if git diff --cached --quiet; then
            git merge --abort 2>/dev/null || true
            echo ">> Không có thay đổi thực tế sau khi bảo lưu cấu hình Doanduy."
            exit 0
          fi

          git commit -m "sync($BRANCH): merge upstream immortalwrt:$UP_REF ($UPSTREAM_SHA) preserving Doanduy 6.6 configs [skip ci]"
          git push origin "$BRANCH"
          echo ">> Đã đẩy cập nhật thành công lên $BRANCH!"

      - name: Trigger Unified Matrix Build (When Requested Manually)
        if: matrix.branch == 'master' && inputs.force_build == true && !cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo ">> Kích hoạt build Unified Matrix cho cả 3 nền tảng (master)..."
          gh workflow run "build-25-unified-matrix.yml" --repo "${{ github.repository }}" -r master -f target=all || true
# [/VERIFIED-GOLDEN]
