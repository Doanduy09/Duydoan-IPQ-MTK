name: Duydoan-25.12 Qualcomm IPQ60xx All-Devices Multi-Target Build

on:
  schedule:
    - cron: '15 20 * * *'
  workflow_dispatch:
    inputs:
      release:
        description: 'Upload to GitHub Releases'
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build Qualcomm IPQ60xx (10 Devices + NSS)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Initialize Build Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo docker system prune -af --volumes || true
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
            git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz \
            mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply \
            python3-docutils qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl \
            unzip vim wget xmlto xxd zlib1g-dev zstd
          sudo timedatectl set-timezone "Asia/Ho_Chi_Minh"

      - name: Update and Install Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Decrypt Secret Assets
        env:
          ALL_SECRET_KEY: ${{ secrets.ALL_SECRET_KEY }}
        run: |
          ENC_FILE="package/base-files/files/etc/init.d/all.enc"
          TARGET_FILE="package/base-files/files/etc/init.d/all"
          if [ -f "$ENC_FILE" ] && [ -n "$ALL_SECRET_KEY" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -pass pass:"$ALL_SECRET_KEY" -in "$ENC_FILE" | zcat > "$TARGET_FILE"
            chmod 755 "$TARGET_FILE"
          fi

      - name: Load Unified Multi-Device Seed Config
        run: |
          cp qualcomm_ipq60xx_all.config .config
          make defconfig

      - name: Download Package Sources
        id: package
        run: |
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile Unified Firmware (Multi-Device)
        id: compile
        run: |
          echo -e "$(nproc) thread compile for Qualcomm IPQ60xx Multi-Device"
          make -j$(nproc) || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Prepare Firmware Artifacts
        id: organize
        if: steps.compile.outputs.status == 'success'
        run: |
          cd bin/targets/qualcommax/ipq60xx
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload Firmware to Actions Artifacts
        uses: actions/upload-artifact@v4
        if: steps.organize.outputs.status == 'success'
        with:
          name: Duydoan-25.12_Qualcomm_IPQ60xx_All_${{ env.BUILD_DATE }}
          path: ${{ env.FIRMWARE }}/*

      - name: Generate Release Notes
        if: steps.organize.outputs.status == 'success' && (inputs.release != false)
        run: |
          cat << 'EOF' > release_notes.md
          ### 🚀 Duydoan-25.12 Qualcomm IPQ60xx Unified Multi-Target Release (NSS 12.5)

          * **Base Version**: ImmortalWrt 25.12 (Bleeding Edge)
          * **Platform Target**: Qualcomm Atheros IPQ6000 / IPQ6010 / IPQ6018 (4x Cortex-A53 + NPU NSS 12.5)
          * **Compilation Mode**: Multi-Device Unified Build (10 Thiết Bị Biên Dịch Đồng Thời)

          #### 📱 Danh Sách Chi Tiết 10 Thiết Bị IPQ60xx:
          1. **JDCloud Athena AX6600 (`jdcloud_re-cs-02`)**: IPQ6010, 1GB DDR4, 128GB eMMC F2FS, 1x 2.5G + 4x 1G, Tri-Band AX6600, M.2 5G + LED ma trận.
          2. **GL.iNet Flint AX1800 (`glinet_gl-ax1800`)**: IPQ6000, 512MB RAM, 128MB NAND, 5x 1G, AX1800, USB 3.0.
          3. **GL.iNet Slate AX (`glinet_gl-axt1800`)**: IPQ6000, 512MB RAM, 128MB NAND, 3x 1G, AX1800, USB 3.0 + khe thẻ nhớ TF.
          4. **Qihoo 360 V6 (`qihoo_360v6`)**: IPQ6000, 512MB RAM, 128MB NAND, 4x 1G, AX1800, USB 3.0.
          5. **Linksys MR7350 (`linksys_mr7350`)**: IPQ6000, 512MB RAM, 256MB NAND, 5x 1G, AX1800, USB 3.0.
          6. **Linksys MR7500 (`linksys_mr7500`)**: IPQ6018, 512MB RAM, 256MB NAND, 1x 2.5G + 4x 1G, AXE6600 Wi-Fi 6E, USB 3.0.
          7. **Netgear WAX214 / WAX610 / WAX610Y**: Access Point doanh nghiệp PoE+, Wi-Fi 6 AX1800.
          8. **Yuncore FAP650**: Access Point công suất cao Wi-Fi 6 PoE.

          #### ⚡ Đồng Nhất 100% Kernel Modules (kmod) & Quay Số 5G Thông Minh:
          * Trọn bộ driver USB/PCIe 4G/5G (`qmi_wwan`, `cdc_mbim`, `mhi_pci`, `rndis`, `ncm`, `ipheeth`), `WWAN Smart Dialer` & `Bác Sĩ 5G Watchdog` (tự khôi phục Interface & IP sau 24h).
          * Qualcomm NSS 12.5 Hardware Offloading + BBR + Cryptodev + TTL 65.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: steps.organize.outputs.status == 'success' && (inputs.release != false)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: Duydoan-25.12-Qualcomm-IPQ60xx-All-${{ env.BUILD_DATE }}
          name: Duydoan-25.12 Qualcomm IPQ60xx Unified All-Devices Release ${{ env.BUILD_DATE }}
          body_path: release_notes.md
          files: ${{ env.FIRMWARE }}/*
