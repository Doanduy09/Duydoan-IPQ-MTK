name: Build Duydoan-24.10 CMCC RAX3000M (All Variants)

on:
  schedule:
    # 06:35 AM Asia/Ho_Chi_Minh daily (23:35 UTC)
    - cron: '35 23 * * *'
  workflow_dispatch:
    inputs:
      release:
        description: 'Upload firmware to GitHub Release'
        required: false
        default: true
        type: boolean

permissions: write-all

jobs:
  build:
    name: Build ${{ matrix.device.name }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        device:
          - name: "CMCC_RAX3000M_eMMC"
            config: "cmcc_rax3000m-emmc.config"
            tag_prefix: "CMCC-RAX3000M-eMMC"
            desc: "CMCC RAX3000M eMMC (MediaTek MT7981B Filogic 820, DDR4 512MB, eMMC Flash, 1x 2.5Gbps WAN/LAN + 3x 1Gbps LAN, USB 3.0, Wi-Fi 6 AX3000 160MHz)"
            flash_type: "eMMC (4GB/8GB)"
          - name: "CMCC_RAX3000M_NAND"
            config: "cmcc_rax3000m-nand.config"
            tag_prefix: "CMCC-RAX3000M-NAND"
            desc: "CMCC RAX3000M NAND (MediaTek MT7981B Filogic 820, DDR4 512MB, SPI-NAND Flash 128MB, 1x 2.5Gbps WAN/LAN + 3x 1Gbps LAN, USB 3.0, Wi-Fi 6 AX3000 160MHz)"
            flash_type: "SPI-NAND (128MB)"

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Initialize Build Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
            git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz \
            mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply \
            python3-docutils qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl \
            unzip vim wget xmlto xxd zlib1g-dev zstd
          sudo timedatectl set-timezone "Asia/Ho_Chi_Minh"

      - name: Update and Install Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Decrypt Secret Assets
        env:
          ALL_SECRET_KEY: ${{ secrets.ALL_SECRET_KEY }}
        run: |
          ENC_FILE="package/base-files/files/etc/init.d/all.enc"
          TARGET_FILE="package/base-files/files/etc/init.d/all"
          if [ -f "$ENC_FILE" ] && [ -n "$ALL_SECRET_KEY" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -pass pass:"$ALL_SECRET_KEY" -in "$ENC_FILE" | zcat > "$TARGET_FILE"
            chmod 755 "$TARGET_FILE"
          fi

      - name: Load Seed Config
        run: |
          [ -e ${{ matrix.device.config }} ] && cp ${{ matrix.device.config }} .config
          make defconfig

      - name: Download Package Sources
        run: |
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile Firmware
        id: compile
        run: |
          echo -e "$(nproc) thread compile for ${{ matrix.device.name }} (24.10)"
          make -j$(nproc) || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Prepare Firmware Artifacts
        id: organize
        if: steps.compile.outputs.status == 'success'
        run: |
          cd bin/targets/mediatek/filogic
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload Firmware to Actions Artifacts
        uses: actions/upload-artifact@v4
        if: steps.organize.outputs.status == 'success'
        with:
          name: Duydoan-24.10_${{ matrix.device.name }}_${{ env.BUILD_DATE }}
          path: ${{ env.FIRMWARE }}/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: steps.organize.outputs.status == 'success' && (inputs.release != false)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: Duydoan-24.10-${{ matrix.device.tag_prefix }}-${{ env.BUILD_DATE }}
          name: Duydoan-24.10 ${{ matrix.device.name }} Release ${{ env.BUILD_DATE }}
          body: |
            ### 🚀 Duydoan-24.10 for ${{ matrix.device.name }}
            * **Phiên bản nền**: ImmortalWrt 24.10 (Stable LTS - Kernel 6.6)
            * **Phần cứng mục tiêu**: ${{ matrix.device.desc }}
            * **Kiểu bộ nhớ Flash**: ${{ matrix.device.flash_type }}
            * **Bộ vi xử lý (SoC)**: MediaTek MT7981B (Filogic 820) 2x ARM Cortex-A53 @ 1.3GHz
            * **Bộ nhớ RAM**: 512MB DDR4
            * **Cổng mạng & Kết nối**: 1 Cổng 2.5Gbps WAN/LAN + 3 Cổng 1Gbps LAN + 1 Cổng USB 3.0
            * **Wi-Fi 6 AX3000**: 2.4GHz 574Mbps (2x2) + 5GHz 2402Mbps (2x2 HE160)
            * **Tăng tốc phần cứng**: MediaTek HNAT (PPE v2 + WED DMA) tải Full 2.5Gbps với CPU ~0% + SafeXcel EIP-97 Crypto Engine.
            * **Bộ ứng dụng Modem & Mạng**:
              - Trọn bộ Modem 4G/5G: QModem, ModemData, Fibocom, Quectel CM, QMI, MBIM, ECM, RNDIS.
              - 1-Click Auto Mesh & Fast Roaming 802.11k/v/r.
              - Giao diện ArgonTheme & Master Dashboard.
            * **Hướng dẫn file nạp**:
              - File firmware nâng cấp: `*cmcc_rax3000m-squashfs-sysupgrade.itb`.
              - File bootloader eMMC: `*emmc-gpt.bin`, `*emmc-preloader.bin`, `*emmc-bl31-uboot.fip`.
              - File bootloader NAND: `*nand-preloader.bin`, `*nand-bl31-uboot.fip`.
          files: ${{ env.FIRMWARE }}/*
