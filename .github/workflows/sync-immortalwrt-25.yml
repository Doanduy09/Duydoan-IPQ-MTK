# SPDX-License-Identifier: MIT
# Automated Upstream Sync Workflow: Safely merges ImmortalWrt 25.12 while protecting all Doanduy custom hardware & configs

name: Sync Upstream ImmortalWrt 25.12

on:
  schedule:
    # Kiem tra dinh ky 2 lan/ngay (01:00 & 13:00 VN = 18:00 & 06:00 UTC)
    - cron: '0 6,18 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Ép buộc kích hoạt Unified Matrix Build dù không có commit mới'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

jobs:
  sync_and_update:
    name: Sync openwrt-25 with upstream immortalwrt:openwrt-25.12
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Branch openwrt-25
        uses: actions/checkout@v4
        with:
          ref: openwrt-25
          fetch-depth: 0

      - name: Configure Git Identity
        run: |
          git config user.name "Doanduy09-Bot"
          git config user.email "doanduy09@gmail.com"
          git checkout -B openwrt-25 origin/openwrt-25

      - name: Check and Sync Upstream ImmortalWrt 25.12
        id: sync_check
        run: |
          git remote add upstream https://github.com/immortalwrt/immortalwrt.git || git remote set-url upstream https://github.com/immortalwrt/immortalwrt.git
          git fetch upstream openwrt-25.12 --depth=100

          UPSTREAM_SHA=$(git rev-parse upstream/openwrt-25.12)
          LOCAL_SHA=$(git rev-parse HEAD)
          echo "Upstream latest commit: $UPSTREAM_SHA"
          echo "Local openwrt-25 commit: $LOCAL_SHA"

          if git merge-base --is-ancestor upstream/openwrt-25.12 HEAD; then
            echo ">> [ALREADY UP-TO-DATE] Nhánh openwrt-25 đã đồng bộ hoàn toàn."
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          else
            echo ">> [NEW UPDATES DETECTED] Đang hợp nhất upstream/openwrt-25.12..."
            echo "has_updates=true" >> "$GITHUB_OUTPUT"

            if git merge upstream/openwrt-25.12 -m "sync: auto-merge upstream immortalwrt:openwrt-25.12 ($UPSTREAM_SHA)"; then
              echo ">> Hợp nhất không xung đột!"
            else
              echo ">> Phát hiện xung đột — bảo lưu 100% cấu hình & thiết bị đặc thù Doanduy..."
              PROTECTED_FILES=(
                "mediatek_filogic_all.config"
                "qualcomm_ipq60xx_all.config"
                "qualcomm_ipq807x_all.config"
                "feeds.conf.default"
                "scripts/ci-prepare.sh"
                "package/base-files/files/etc/init.d/all.enc"
                "target/linux/mediatek/image/filogic.mk"
                "target/linux/mediatek/dts/mt7981b-wirelesstag-zx7981pd.dts"
                "target/linux/mediatek/dts/mt7981b-viettel-nr3053.dts"
                "target/linux/mediatek/dts/mt7981b-sdmc-mt3053.dts"
                "target/linux/qualcommax/image/ipq60xx.mk"
                "target/linux/qualcommax/image/ipq807x.mk"
                "package/firmware/ipq-wifi/Makefile"
                ".github/workflows/build-25-unified-matrix.yml"
                ".github/workflows/Auto-Clean.yml"
                ".github/workflows/sync-immortalwrt-25.yml"
              )
              for pf in "${PROTECTED_FILES[@]}"; do
                git checkout --ours "$pf" 2>/dev/null || true
              done
              # Never accidentally re-track plaintext init.d/all
              git rm -f --cached package/base-files/files/etc/init.d/all 2>/dev/null || true
              git add -A
              git commit -m "sync: resolve merge conflicts preserving Doanduy hardware & configs" || true
            fi

            git push origin openwrt-25
            echo ">> Đã đẩy cập nhật thành công lên openwrt-25!"
          fi

      - name: Trigger Unified Matrix Build (When New Updates Exist)
        if: (steps.sync_check.outputs.has_updates == 'true' || inputs.force_build == true) && !cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo ">> Kích hoạt build Unified Matrix cho cả 3 nền tảng (openwrt-25)..."
          gh workflow run "build-25-unified-matrix.yml" --repo "${{ github.repository }}" -r openwrt-25 -f target=all || true
